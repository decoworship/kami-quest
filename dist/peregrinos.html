  const cloudCol = th.bg === 'cave' ? 'rgba(255,140,90,0.05)' : th.bg === 'abyss' ? 'rgba(120,220,255,0.04)' : 'rgba(255,255,255,0.05)';
  for (let i = 0; i < 16; i++) {
    const x = rnd() * BG_LW, y = 30 + rnd() * 150, w = 50 + rnd() * 110;
    seam(d => { cx.fillStyle = cloudCol; for (let k = 0; k < 4; k++) { cx.beginPath(); cx.ellipse(x + d + (k - 1.5) * w * 0.22, y + Math.sin(k * 1.7) * 3, w * 0.28, 6 + rnd() * 4, 0, 0, 7); cx.fill(); } });
  }
  const L = [0, 1, 2, 3].map(() => mkCanvas(BG_LW, H));
  const X = L.map(c => c.getContext('2d'));

  if (th.bg === 'hills') {
    // 0: cordilheira distante
    ridge(X[0], C[0], 200, [[26, 3], [12, 7], [5, 17]], rnd, 2);
    // 1: colinas com vilarejo adormecido
    ridge(X[1], C[1], 238, [[14, 4], [7, 9]], rnd);
    for (let i = 0; i < 9; i++) { const x = Math.floor(rnd() * BG_LW), y = 236 + Math.floor(rnd() * 10); seam(d => house(X[1], x + d, y, 10 + Math.floor(rnd() * 6), 7 + Math.floor(rnd() * 4), C[1], rnd() < 0.5 ? warm(0.22) : null)); }
    for (let i = 0; i < 26; i++) { const x = rnd() * BG_LW; seam(d => poplar(X[1], x + d, 246, 20 + rnd() * 10, 4, C[1])); }
    // 2: árvores redondas, rede de dormir, cercas
    ridge(X[2], C[2], 268, [[10, 5], [5, 11]], rnd);
    for (let i = 0; i < 14; i++) {
      const x = rnd() * BG_LW, y = 268 + rnd() * 6, h = 14 + rnd() * 12, r = 12 + rnd() * 9;
      seam(d => roundTree(X[2], x + d, y, h, r, C[2], hi(2)));
      if (i % 4 === 0) seam(d => { X[2].strokeStyle = C[2]; X[2].lineWidth = 2; X[2].beginPath(); X[2].moveTo(x + d, y - h + 4); X[2].quadraticCurveTo(x + d + 34, y - h + 20, x + d + 68, y - h + 4); X[2].stroke(); });
    }
    for (let i = 0; i < 10; i++) { const x = Math.floor(rnd() * BG_LW); seam(d => { X[2].fillStyle = C[2]; for (let k = 0; k < 6; k++) X[2].fillRect(x + d + k * 6, 262, 2, 12); X[2].fillRect(x + d, 265, 32, 1); }); }
    // 3: arbustos e capim próximos
    ridge(X[3], C[3], 300, [[6, 6], [3, 15]], rnd, 3);
    for (let i = 0; i < 40; i++) { const x = rnd() * BG_LW, r = 5 + rnd() * 8; seam(d => { X[3].fillStyle = C[3]; X[3].beginPath(); X[3].arc(x + d, 298, r, Math.PI, 0); X[3].fill(); X[3].fillStyle = hi(3); X[3].fillRect(Math.round(x + d - 1), Math.round(298 - r), 3, 1); }); }
  } else if (th.bg === 'towers') {
    // 0: horizonte de cúpulas e torres
    for (let i = 0; i < 40; i++) {
      const x = Math.floor(rnd() * BG_LW), w = 14 + Math.floor(rnd() * 26), h = 50 + Math.floor(rnd() * 90), y = 250 - h, dome = rnd() < 0.35;
      seam(d => { X[0].fillStyle = C[0]; X[0].fillRect(x + d, y, w, H - y); if (dome) { X[0].beginPath(); X[0].arc(x + d + w / 2, y, w / 2, Math.PI, 0); X[0].fill(); X[0].fillRect(x + d + w / 2 - 1, y - w / 2 - 8, 2, 8); } else { X[0].beginPath(); X[0].moveTo(x + d - 2, y); X[0].lineTo(x + d + w / 2, y - 14 - rnd() * 16); X[0].lineTo(x + d + w + 2, y); X[0].fill(); } });
    }
    dots(X[0], rnd, 120, warm(0.18), 140, 250, 1);
    // 1: torres altas, roda-gigante, estandartes
    for (let i = 0; i < 16; i++) {
      const x = Math.floor(rnd() * BG_LW), w = 18 + Math.floor(rnd() * 22), h = 120 + Math.floor(rnd() * 110), y = H - h;
      seam(d => {
        X[1].fillStyle = C[1]; X[1].fillRect(x + d, y, w, h);
        X[1].beginPath(); X[1].moveTo(x + d - 3, y); X[1].lineTo(x + d + w / 2, y - 16 - rnd() * 18); X[1].lineTo(x + d + w + 3, y); X[1].fill();
        X[1].fillStyle = hi(1); X[1].fillRect(x + d, y, 1, h);
        for (let k = 0; k < 8; k++) if (rnd() < 0.55) { X[1].fillStyle = warm(0.16 + rnd() * 0.16); X[1].fillRect(x + d + 3 + Math.floor(rnd() * (w - 6)), y + 10 + Math.floor(rnd() * (h - 30)), 2, 3); }
        if (rnd() < 0.5) { X[1].fillStyle = mixHex(C[1], '#a04060', 0.25); X[1].fillRect(x + d + w, y + 14, 8, 14); X[1].fillRect(x + d + w, y + 28, 4, 3); }

const BG_PARALLAX = [0.05, 0.12, 0.22, 0.36];

function drawCrossHill(screenX, dawn) {

let DARK = null;
function drawDarkness(sc, lights, level) {
  if (!DARK) DARK = mkCanvas(W, H);
  const d = DARK.getContext('2d');
  d.globalCompositeOperation = 'source-over';
  d.clearRect(0, 0, W, H);
  d.fillStyle = `rgba(1,3,12,${level})`; d.fillRect(0, 0, W, H);
  d.globalCompositeOperation = 'destination-out';
  for (const L of lights) {
    const x = L.x - sc.cam, y = L.y + OY, r = L.r * (1 + Math.sin(sc.t * 0.07 + L.x) * 0.03);
    if (x < -r || x > W + r) continue;
    for (const oy of [0, WORLD_H, -WORLD_H]) {
      const yy = y + oy; if (yy < -r || yy > H + r) continue;
      const g = d.createRadialGradient(x, yy, 0, x, yy, r);
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.55, 'rgba(0,0,0,0.75)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      d.fillStyle = g; d.fillRect(x - r, yy - r, r * 2, r * 2);
    }
  }
  d.globalCompositeOperation = 'source-over';
  G.imageSmoothingEnabled = true; G.drawImage(DARK, 0, 0); G.imageSmoothingEnabled = false;
}
function drawFog(sc) {
  const b = buildBackground(sc.th);
  G.imageSmoothingEnabled = true;
  G.globalAlpha = 0.55;
  const o1 = -mod(sc.cam * 0.6 + sc.t * 0.25, 640), o2 = -mod(sc.cam * 0.9 - sc.t * 0.15, 640);

  G.drawImage(b.fog, o2, 20); G.drawImage(b.fog, o2 + 640, 20);
  G.globalAlpha = 1; G.imageSmoothingEnabled = false;
}

function hudLayout(n) { return [0, 1, 2, 3].slice(0, n).map(i => ({ x: 6 + i * 158, y: 4 })); }
function drawHUD(sc) {
  const lay = hudLayout(sc.players.length);
  sc.players.forEach((p, i) => {
    const { x, y } = lay[i];
    G.fillStyle = 'rgba(8,6,16,0.62)'; G.fillRect(x, y, 150, 24);
    G.fillStyle = p.ch.color; G.fillRect(x, y, 2, 24);

    G.fillStyle = p.ch.pal.hood; G.fillRect(x + 5, y + 4, 14, 16);
    G.fillStyle = p.ch.pal.skin; G.fillRect(x + 8, y + 8, 9, 9);
    G.fillStyle = '#1d1420'; G.fillRect(x + 14, y + 11, 1, 2);
    if (p.ch.pal.beard) { G.fillStyle = p.ch.pal.beard; G.fillRect(x + 11, y + 15, 6, 2); }
    if (p.state === 'down') { G.fillStyle = 'rgba(10,8,20,0.7)'; G.fillRect(x + 5, y + 4, 14, 16); }
    for (let h = 0; h < p.maxHp; h++) drawIcon(h < p.hp ? 'heart' : 'heartE', x + 23 + h * 8, y + 3, h < p.hp ? '#ff5a72' : '#5a4a5a');
    if (p.shield) ring(x + 12, y + 12, 9, '#86dcf7');
    for (let s = 0; s < 2; s++) {
      const bx = x + 23 + s * 12, by = y + 12, act = s === p.active;
      G.fillStyle = act ? '#f4efe4' : '#4a4458'; G.fillRect(bx - 1, by - 1, 11, 11);
      G.fillStyle = '#0c0a16'; G.fillRect(bx, by, 9, 9);
      const f = p.slots[s]; if (f) drawIcon(f, bx + 1, by + 1, FRUITS[f].color);
    }
    for (let l = 0; l < p.louvor; l++) drawIcon('shofar', x + 50 + l * 9, y + 14, '#f2cf5b');
  });
  // contadores da fase
  const by = H - 16;
  G.fillStyle = 'rgba(8,6,16,0.55)'; G.fillRect(4, by - 2, 92, 14);
  drawIcon('scroll', 8, by, '#efe0b4');
  drawIcon('person', 52, by, '#fff3c2');
  if (sc.boss && !sc.boss.dead && sc.boss.state !== 'intro') {
    const bw = 300, bx = (W - bw) / 2, yy = H - 14;
    G.fillStyle = 'rgba(8,6,16,0.7)'; G.fillRect(bx - 2, yy - 2, bw + 4, 9);

    G.fillStyle = 'rgba(255,255,255,0.25)'; G.fillRect(bx, yy, Math.round(bw * sc.boss.hp / sc.boss.maxHp), 1);
  }
}

//  Cena de jogo: uma fase da jornada
// ============================================================
class PlayScene {
  constructor(game, pi, party) {
    this.game = game; this.pi = pi; this.ph = PHASES[pi]; this.th = this.ph.theme; this.diff = DIFFS[Save.data.diff];
    LV = buildLevel(pi); renderTiles(LV); buildBackground(this.th);
    this.players = party.map((m, i) => new Player(i, m.ci, Input.devs[m.dev], this));
    this.enemies = []; this.projs = []; this.pickups = []; this.parts = []; this.amb = []; this.objs = []; this.texts = []; this.rings = [];
    this.cam = 0; this.lock = null; this.lockB = null; this.pBounds = { min: 0, max: LV.w }; this.boss = null;
    this.t = 0; this.freezeT = 0; this.shakeT = 0; this.shakeM = 0; this.invulnAll = 0; this.flashT = 0;
    this.stats = { scrolls: [], captives: [], saved: 0, kills: 0, time: 0, boss: false };
    this.banners = []; this.toasts = []; this.modal = null; this.paused = false; this.pauseSel = 0; this.pauseView = null;
    this.respawnT = 0; this.done = false; this.endT = 0; this.dawn = 0; this.dawnTarget = 0; this.jarT = 900 + randi(0, 600);
    this.glow = clamp(game.semelhanca() / 100, 0, 1);
    const ps = Save.data.phases[pi];
    let start = { x: 48, feet: 304 };
    let tutorial = pi === 0;
    for (const sp of LV.spawns) {
      const x = sp.c * TS, y = sp.r * TS;
      switch (sp.ch) {
        case 'S': start = { x: x + 4, feet: y + TS }; break;
        case 'E': this.objs.push(new Ebenezer(x + 1, y, sp.id)); break;
        case 'C': this.objs.push(new Captive(sp, this.ph.captive, this.ph.lines, ps.captives.includes(sp.id))); break;
        case 'P': this.objs.push(new ScrollPick(sp, ps.scrolls.includes(sp.k))); break;
        case 'J': this.objs.push(new Jar(x + 2, y + 2)); break;
        case 'H': this.pickups.push(new Pickup('heart', x + 8, y + 8, { float: true })); break;
        case 'T': this.pickups.push(new Pickup('shofar', x + 8, y + 8, { float: true })); break;
        case 'B': this.objs.push(new Spring(x + 1, y + 10)); break;
        default: {
          const type = this.ph.enemies[+sp.ch - 1];
          if (type) this.enemies.push(new Enemy(type, x + 8, y + 16, this));
        }
      }
    }
    if (tutorial) for (const s of TUTORIAL_SIGNS) this.objs.push(new Sign(s.col * TS + 2, 18 * TS + 2, s.text));
    this.checkpoint = { x: start.x, feet: start.feet };
    this.players.forEach((p, i) => { p.x = start.x + i * 10; p.y = start.feet - p.h; p.facing = 1; });
    this.banner(`${pi + 1}. ${this.ph.name}`, this.ph.sins, `"${this.ph.intro.text}" — ${this.ph.intro.ref}`, 300);
    Music.play(this.ph.music);
  }

  // ---------------- utilidades usadas pelas entidades ----------------
  part(x, y, vx, vy, c, l, s = 1, g = 0, a = 1) { if (this.parts.length < 900) this.parts.push({ x, y, vx, vy, c, l, m: l, s, g, a, fr: 1 }); }
  shake(m, d) { if (REDUCED_MOTION) m = Math.min(1, m * 0.3); this.shakeM = Math.max(this.shakeM, m); this.shakeT = Math.max(this.shakeT, d); }
  freeze(n) { this.freezeT = Math.max(this.freezeT, n); }
  ftext(text, x, y, color = '#fff', life = 60, size = 7) { this.texts.push({ text, x, y, color, life, max: life, size }); }
  toast(text, sub, dur = 220) { this.toasts.push({ text, sub, t: 0, dur }); if (this.toasts.length > 2) this.toasts.shift(); }
  banner(title, sub, ref, dur = 180, big = true) { this.banners.push({ title, sub, ref, t: 0, dur, big }); }
  flashRing(x, y, r, col) { this.rings.push({ x, y, r: 0, max: r, col, t: 0 }); }
  nearestPlayer(e) { return nearestPlayer(this, e); }
  nearestTarget(x, y, range) {
    let best = null, bd = range;
    for (const e of this.enemies) if (!e.dead && e.active && e.spawnT <= 0) { const d = Math.hypot(ecx(e) - x, wrapDY(ecy(e) - y)); if (d < bd) { bd = d; best = e; } }
    if (this.boss && !this.boss.dead && !this.boss.dying && this.boss.state !== 'intro') {
      const b = this.boss.hurtBox(); const bx = b[0] + b[2] / 2, by = b[1] + b[3] / 2;
      const d = Math.hypot(bx - x, wrapDY(by - y)); if (d < bd + 60) best = { cx: bx, cy: by, dead: false };
    }
    return best;
  }
  spawnWaveEnemy(type, x, y) {
    const e = new Enemy(type, x, y + ETYPES[type].h * SPRITE_SCALE / 2, this, { wave: true, spawnT: 40, bnd: this.lockB });
    this.enemies.push(e); return e;
  }

  // ---------------- eventos ----------------
  onEnemyDie(e) {
    this.stats.kills++;
    const d = this.diff.drop, r = Math.random();
    if (r < 0.07 * d) this.pickups.push(new Pickup('heart', ecx(e), ecy(e), { vy: -2.2, life: 720 }));
    else if (r < 0.105 * d) this.pickups.push(new Pickup('fruit', ecx(e), ecy(e), { fruit: randomFruit(), vy: -2.2, life: 720 }));
    else if (r < 0.12 * d) this.pickups.push(new Pickup('shofar', ecx(e), ecy(e), { vy: -2.2, life: 720 }));
  }
  onScroll(s) {
    if (!this.stats.scrolls.includes(s.k)) this.stats.scrolls.push(s.k);
    const sc = this.ph.scrolls[s.k];
    this.modal = { type: 'scroll', text: sc.text, ref: sc.ref, known: s.known, t: 0, n: this.stats.scrolls.length };
    Snd.play('scroll');
  }
  onCaptive(c) {
    if (!this.stats.captives.includes(c.id)) this.stats.captives.push(c.id);
    this.stats.saved++;
    this.ftext(c.line, c.x + c.w / 2, c.y - 10, '#fff3c2', 170, 7);
    Snd.play('captive');
  }
  onFruit(f) {
    if (!Save.data.fruitsSeen.includes(f)) {
      Save.data.fruitsSeen.push(f); Save.write();
      this.toast(`${FRUITS[f].name}: ${FRUITS[f].desc}`, FRUITS[f].ref, 300);
    }
  }
  onCheckpoint(eb) {
    this.checkpoint = { x: eb.x, feet: eb.y + eb.h };
    Snd.play('checkpoint');
    for (const p of this.players) {
      if (p.state === 'down') { p.state = 'alive'; p.hp = Math.min(p.maxHp, this.diff.revive); p.x = eb.x; p.y = eb.y + eb.h - p.h; p.iframes = 90; p.rx = 0; p.ry = 0; }
      else if (p.hp < p.maxHp) p.hp++;
      p.louvor = Math.max(p.louvor, this.diff.louvor);
    }
    this.toast(t('ebenezer'), t('ebenezerRef'), 200);
    for (let i = 0; i < 20; i++) this.part(eb.x + 7, eb.y + 4, rand(-1.5, 1.5), rand(-3, -0.5), '#ffd86b', 40, 1, 0.05);
  }
  onPlayerDown(p) {
    this.shake(5, 14);
    if (this.players.some(o => o.state === 'alive')) this.toast(t('fell', p.ch.name), t('gal62full'), 200);
  }
  onBossDying(b) {
    for (const pr of this.projs) if (pr.owner === 'e') pr.dead = true;
    for (const e of this.enemies) if (!e.dead && e.x > b.room.x0 - 16 && e.x < b.room.x1 + 16) e.die(this, null);
    this.invulnAll = 400; Music.stop(); this.shake(6, 40);
    if (this.pi === 4) this.banner(t('finished'), t('finishedRef'), t('col214'), 360);
  }
  onBossDead(b) {
    this.stats.boss = true;
    const rx = b.room.x0;
    for (let i = 0; i < 5; i++) {
      const c = new Captive({ id: 'final' + i, c: Math.floor((b.cx - 40 + i * 20) / TS), r: 17 }, this.ph.captive, this.ph.lines, false);
      c.x = Math.round(clamp(b.cx - 40 + i * 20, rx + 40, rx + W - 60)); c.y = FLOOR_Y - c.h; c.freed = true; c.hittable = false; c.baseY = c.y; c.ft = -i * 10;
      this.objs.push(c);
    }
    this.stats.saved += 5;
    Music.play('victory');
    Snd.play('captive');
    if (this.pi < 4) this.banner(t('victory'), t('victory' + this.pi), `"${this.ph.bossCard.text}" — ${this.ph.bossCard.ref}`, 260);
    else { this.dawnTarget = 1; this.banner(t('accuserOut'), t('noCondemn'), t('rom81'), 300); }
    this.exitT = 150;
  }
  louvor(p) {
    this.flashT = 14; p.iframes = Math.max(p.iframes, 70);
    this.rings.push({ x: p.cx, y: p.cy, r: 0, max: 420, col: '#fff3c2', t: 0 });
    for (const e of this.enemies) if (!e.dead && e.x > this.cam - 30 && e.x < this.cam + W + 30) { e.active = true; e.hurt(6, p, this, 'louvor'); }
    if (this.boss && !this.boss.dead && !this.boss.dying && this.boss.state !== 'intro') this.boss.hurt(10, this);
    for (const pr of this.projs) if (pr.owner === 'e') pr.dead = true;
    const c0 = Math.floor(this.cam / TS), c1 = Math.floor((this.cam + W) / TS);
    for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1; c++) if (tileAt(c, r) === T_BREAK) damageTile(c, r, 99, this);
    Snd.play('louvor'); this.shake(6, 22);
    this.ftext(t('praise'), p.cx, p.y - 16, '#fff3c2', 70, 10);
    for (let i = 0; i < 30; i++) { const a = rand(0, 6.28); this.part(p.cx, p.cy, Math.cos(a) * rand(1, 4), Math.sin(a) * rand(1, 4), pick(['#fff3c2', '#f2cf5b', '#ffffff']), 50, 2, 0); }
  }
  completePhase() {
    if (this.done) return;
    this.done = true; this.endT = 0; Snd.play('portal');
  }

  // ---------------- atualização ----------------
  update() {
    if (this.modal) {
      this.modal.t++;
      if (this.modal.t > 45 && (Input.anyPressed('ok') || Input.anyPressed('jump') || Input.anyPressed('sword') || Input.anyPressed('shoot'))) { this.modal = null; Snd.play('ok'); }
      return;
    }
    if (Input.anyPressed('start')) { this.paused = !this.paused; this.pauseSel = 0; this.pauseView = null; Snd.play('menu'); return; }
    if (this.paused) { this.updatePause(); return; }
    if (this.done) { this.endT++; if (this.endT > 70) this.game.toSummary(this); return; }
    this.t++; this.stats.time++;
    if (this.invulnAll > 0) this.invulnAll--;
    if (this.flashT > 0) this.flashT--;
    for (const b of this.banners) b.t++; this.banners = this.banners.filter(b => b.t < b.dur);
    for (const t of this.toasts) t.t++; this.toasts = this.toasts.filter(t => t.t < t.dur);
    if (this.freezeT > 0) { this.freezeT--; return; }
    if (this.shakeT > 0) this.shakeT--; else this.shakeM = 0;
    this.dawn = approach(this.dawn, this.dawnTarget, 0.004);

    this.updateCamera();
    for (const p of this.players) {
      p.bnd = this.pBounds;
      if (p.state === 'alive' && (p.x < this.pBounds.min || p.x + p.w > this.pBounds.max)) {
        const nx = clamp(p.x, this.pBounds.min, this.pBounds.max - p.w);
        if (!solidRect(nx, p.y, p.w, p.h, null)) p.x = nx;
      }
      p.update(this);
    }
    this.updateRooms();
    for (const e of this.enemies) {
      if (e.dead) continue;
      if (!e.active && e.x > this.cam - 30 && e.x < this.cam + W + 30) e.active = true;
      if (e.active && e.x > this.cam - 220 && e.x < this.cam + W + 220) e.update(this);
    }
    this.enemies = this.enemies.filter(e => !e.dead);
    if (this.boss) { this.boss.update(this); if (this.boss.dead) this.boss = null; }
    for (const p of this.projs) updateProj(p, this);
    this.projs = this.projs.filter(p => !p.dead);
    for (const p of this.pickups) p.update(this);
    this.pickups = this.pickups.filter(p => !p.dead);
    for (const o of this.objs) if (o.x > this.cam - 120 && o.x < this.cam + W + 120) o.update(this);
    this.objs = this.objs.filter(o => !o.dead);
    updateParts(this.parts);
    ambientParticles(this); updateParts(this.amb);
    for (const t of this.texts) { t.life--; t.y -= 0.25; } this.texts = this.texts.filter(t => t.life > 0);
    for (const r of this.rings) { r.t++; r.r += (r.max - r.r) * 0.12 + 2; } this.rings = this.rings.filter(r => r.r < r.max - 2 && r.t < 60);

    if (this.exitT > 0 && --this.exitT === 0) {
      const room = LV.rooms[LV.rooms.length - 1];
      this.objs.push(new ExitPortal(room.x0 + 35 * TS, FLOOR_Y - 40));
      this.toast(t('doorOpen'), t('doorVerse'), 260);
      Snd.play('portal');
    }
    // vasos voadores (como as cápsulas de Contra)
    if (!this.lock && --this.jarT <= 0) {
      this.jarT = randi(1500, 2400);
      const dir = chance(0.5) ? 1 : -1;
      this.objs.push(new Jar(dir > 0 ? this.cam - 30 : this.cam + W + 20, randi(50, 150), { flying: true, vx: dir * 1.1 }));
    }
    // todos caídos
    if (this.respawnT === 0 && this.players.every(p => p.state === 'down')) {
      this.respawnT = 170;
      this.banner(t('riseUp'), t('riseSub'), t('mic78'), 170);
    }
    if (this.respawnT > 0 && --this.respawnT === 0) this.respawn();
  }
  updateCamera() {
    const alive = this.players.filter(p => p.state === 'alive');
    const maxCam = LV.w - W, M = 8;
    if (this.lock) {
      this.cam = lerp(this.cam, this.lock.x0, 0.14); if (Math.abs(this.cam - this.lock.x0) < 0.6) this.cam = this.lock.x0;
      this.pBounds = { min: this.lock.x0 + 16, max: this.lock.x1 - 16 };
      return;
    }
    if (!alive.length) return;
    let mn = Infinity, mx = -Infinity;
    for (const p of alive) { mn = Math.min(mn, p.x); mx = Math.max(mx, p.x + p.w); }
    const target = clamp((mn + mx) / 2 - W / 2, 0, maxCam);
    this.cam = lerp(this.cam, target, 0.12);
    const lo = mx + M - W, hi = mn - M;
    if (lo <= hi) this.cam = clamp(this.cam, lo, hi); else this.cam = (lo + hi) / 2;
    this.cam = clamp(this.cam, 0, maxCam);
    this.pBounds = { min: Math.max(0, this.cam + M), max: Math.min(LV.w, this.cam + W - M) };
  }
  updateRooms() {
    const alive = this.players.filter(p => p.state === 'alive');
    for (const room of LV.rooms) {
      if ((room.type === 'arena' || room.type === 'boss') && room.state === 'idle' && !this.lock) {
        const trig = alive.find(p => p.x > room.x0 + 5 * TS && p.x < room.x1 - 24);
        if (trig) this.activateRoom(room, trig);
      }
      if (room.state === 'active' && room.type === 'arena') this.updateArena(room);
    }
  }
  activateRoom(room, trig) {
    room.state = 'active';
    this.lock = { x0: room.x0, x1: room.x1, room };
    this.lockB = { min: room.x0 + 16, max: room.x1 - 16 };
    for (const p of this.players) {
      if (p.x < room.x0 + 16 || p.x > room.x1 - 24) {
        p.x = clamp(trig.x - 10, room.x0 + 20, room.x1 - 30); p.y = trig.y; p.rx = 0; p.ry = 0;
        if (p.state === 'alive' && solidRect(p.x, p.y, p.w, p.h, null)) { p.x = trig.x; }
      }
    }
    for (const e of this.enemies) if (e.x >= room.x0 && e.x <= room.x1) e.bnd = this.lockB;
    Snd.play('warn');
    if (room.type === 'arena') {
      room.wave = 0; room.waveT = 60; room.spawnQ = null; room.pi = 0;
      this.banner(t('trial'), t('trialSub'), t('jas112'), 150, false);
    } else {
      const Cls = BOSS_CLASSES[this.ph.boss];
      this.boss = new Cls(this, room);
      const bc = this.ph.bossCard;
      this.bossCard = { t: 0, dur: 170 };
      Music.play(this.pi === 4 ? 'boss5' : 'boss');
      Snd.play('roar'); this.shake(4, 30);
    }
  }
  updateArena(room) {
    const aliveE = this.enemies.filter(e => !e.dead && e.wave).length;
    if (room.spawnQ && room.spawnQ.length) {
      if (--room.spawnT <= 0) {
        const slot = room.spawnQ.shift();
        const portal = room.portals[room.pi % room.portals.length]; room.pi++;
        const type = this.ph.enemies[slot - 1];
        this.enemies.push(new Enemy(type, portal.x, portal.y + ETYPES[type].h * SPRITE_SCALE / 2, this, { wave: true, spawnT: 40, bnd: this.lockB }));
        room.spawnT = 26;
      }
      return;
    }
    if (aliveE > 0) return;
    if (room.waveT > 0) { room.waveT--; return; }
    if (room.wave >= room.waves.length) {
      room.state = 'done'; this.lock = null; this.lockB = null;
      for (const e of this.enemies) e.bnd = null;
      this.banner(t('victorySmall'), t('pathGoesOn'), null, 120, false);
      Snd.play('checkpoint');
      const cx = room.x0 + W / 2;
      this.objs.push(new Jar(cx - 6, 140));
      this.pickups.push(new Pickup('heart', cx + 30, 140, { float: true }));
      return;
    }
    const base = room.waves[room.wave];
    const n = Math.max(2, Math.round(base.length * this.diff.count * (1 + 0.35 * (this.players.length - 1))));
    room.spawnQ = []; for (let i = 0; i < n; i++) room.spawnQ.push(base[i % base.length]);
    room.wave++; room.waveT = 80; room.spawnT = 10;
    this.ftext(t('wave', room.wave, room.waves.length), room.x0 + W / 2, 60, '#ffd8a8', 90, 9);
  }
  respawn() {
    if (this.lock) {
      const room = this.lock.room;
      room.state = 'idle'; room.spawnQ = null; room.wave = 0;
      this.lock = null; this.lockB = null;
      this.enemies = this.enemies.filter(e => !e.wave);
      this.boss = null; this.bossCard = null;
      Music.play(this.ph.music);
    }
    this.projs = [];
    const cp = this.checkpoint;
    this.players.forEach((p, i) => {
      p.state = 'alive'; p.hp = p.maxHp; p.x = cp.x + i * 6; p.y = cp.feet - p.h; p.vx = 0; p.vy = 0; p.rx = 0; p.ry = 0; p.iframes = 120;
      p.louvor = Math.max(p.louvor, this.diff.louvor); p.dashT = 0;
      if (solidRect(p.x, p.y, p.w, p.h, null)) p.x = cp.x;
    });
    this.cam = clamp(cp.x - W / 2, 0, LV.w - W);
  }
  updatePause() {
    const nv = Input.nav();
    if (this.pauseView) { if (nv.ok || nv.cancel) { this.pauseView = null; Snd.play('back'); } return; }
    const items = this.pauseItems();
    if (nv.up) { this.pauseSel = mod(this.pauseSel - 1, items.length); Snd.play('menu'); }
    if (nv.down) { this.pauseSel = mod(this.pauseSel + 1, items.length); Snd.play('menu'); }
    if (nv.cancel) { this.paused = false; return; }
    if (nv.ok) {
      const it = items[this.pauseSel]; Snd.play('ok');
      if (it.id === 'cont') this.paused = false;
      else if (it.id === 'ctrl') this.pauseView = 'ctrl';
      else if (it.id === 'mus') Music.toggle();
      else if (it.id === 'lang') { this.game.setLang(LANG === 'pt' ? 'en' : 'pt'); }
      else if (it.id === 'map') { this.paused = false; this.game.toMap(); }
    }
  }
  pauseItems() {
    return [{ id: 'cont', label: t('resume') }, { id: 'ctrl', label: t('controls') }, { id: 'mus', label: t('music', Music.on ? t('on') : t('off')) }, { id: 'lang', label: t('language') }, { id: 'map', label: t('toMap') }];
  }

  // ---------------- desenho ----------------
  revealAt(x, y) {
    if (Save.hasGift('discernimento')) return true;
    for (const p of this.players) if (p.state === 'alive' && p.ch.id === 'vigia' && Math.hypot(p.cx - x, wrapDY(p.cy - y)) < 100) return true;
    return false;
  }
  drawDynamicTiles() {
    const c0 = Math.max(0, Math.floor(this.cam / TS) - 1), c1 = Math.min(LV.cols - 1, Math.floor((this.cam + W) / TS) + 1);
    for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1; c++) {
      const t = LV.grid[r * LV.cols + c];
      if (t !== T_BREAK && t !== T_FAKE) continue;
      const x = c * TS, y = r * TS, rev = this.revealAt(x + 8, y + 8);
      if (t === T_BREAK) {
        drawSolidTile(G, LV, c, r);
        const hp = LV.bhp.get(r * LV.cols + c) || 3;
        const cr = shade(LV.ph.theme.tileDark, -0.4);
        R(x + 4, y + 3, 1, 5, cr); R(x + 5, y + 7, 3, 1, cr); R(x + 8, y + 8, 1, 4, cr); R(x + 10, y + 4, 3, 1, cr);
        if (hp < 3) { R(x + 2, y + 10, 4, 1, cr); R(x + 11, y + 9, 1, 4, cr); }
        if (hp < 2) { R(x + 6, y + 1, 1, 3, cr); R(x + 12, y + 12, 3, 1, cr); }
        if (rev) { G.globalAlpha = 0.4 + 0.3 * Math.sin(this.t * 0.1); G.strokeStyle = '#ffe08a'; G.lineWidth = 1; G.strokeRect(x + 0.5, y + 0.5, 15, 15); G.globalAlpha = 1; }
      } else {
        let near = false;
        for (const p of this.players) if (p.state === 'alive' && overlapR(p.x - 6, p.y - 6, p.w + 12, p.h + 12, x, y, 16, 16)) near = true;
        drawSolidTile(G, LV, c, r, near ? 0.3 : 1);

  lights() {
    const L = [], disc = Save.hasGift('discernimento') ? 36 : 0;

      else L.push({ x: p.cx, y: p.cy, r: 34 });
    }

    for (const e of this.enemies) if (e.light) L.push({ x: e.cx + e.facing * 11 * e.S, y: e.y - 4 * e.S, r: e.light });
    for (const o of this.objs) if (o.light) L.push({ x: o.x + o.w / 2, y: o.y + o.h / 2, r: o.light });
    for (const p of this.pickups) L.push({ x: p.x + 5, y: p.y + 5, r: 20 });

  draw() {
    resetG();

    drawBackground(this.th, this.cam, this.t, { dawn: this.dawn, cross: crossX });

    drawParts(this.parts);
    for (const r of this.rings) { G.globalAlpha = Math.max(0, 1 - r.t / 60); ring(r.x, r.y, r.r, r.col, 2); G.globalAlpha = 1; }
    G.restore();
    if (this.ph.dark) { drawDarkness(this, this.lights(), this.stats.boss ? 0.6 : 0.93); this.drawEmissive(sx, sy); }
    if (this.ph.fog) drawFog(this);
    if (this.flashT > 0) { G.globalAlpha = this.flashT / 14 * 0.7; R(0, 0, W, H, '#fff8e0'); G.globalAlpha = 1; }
    drawHUD(this);

  drawEmissive(sx, sy) {
    // bordas bioluminescentes: as plataformas continuam legíveis no escuro
    G.save(); G.translate(-Math.round(this.cam) + sx, OY + sy);
    const th = this.th, c0 = Math.max(0, Math.floor(this.cam / TS)), c1 = Math.min(LV.cols - 1, Math.floor((this.cam + W) / TS) + 1);

      else if (t === T_ONEWAY) { G.globalAlpha = pulse * 0.6; G.fillStyle = th.top; G.fillRect(x, y, 16, 1); }
      else if (t === T_SPIKE) { G.globalAlpha = pulse; G.fillStyle = th.spike; for (let i = 0; i < 4; i++) G.fillRect(x + i * 4 + 1, y + 8, 1, 1); }
    }
    G.globalAlpha = 1; G.restore();

  w2s(x, y) { return [x - this.cam + this.sx, mod(y, WORLD_H) + OY + this.sy]; }

// Fundo noturno com a Cidade Celestial ao longe (título e final)
function drawJourneyBackdrop(t, dawn = 0, walkers = null) {
  const gr = G.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, mixHex('#0b0a1a', '#3a4a8a', dawn)); gr.addColorStop(0.6, mixHex('#1f1a3a', '#f0a070', dawn)); gr.addColorStop(1, mixHex('#2e2546', '#ffe0a0', dawn));
  G.fillStyle = gr; G.fillRect(0, 0, W, H);
  const rnd = mulberry32(77);
  for (let i = 0; i < 120; i++) { const x = rnd() * W, y = rnd() * 220, tw = Math.sin(t * 0.05 + i) * 0.3 + 0.7; G.fillStyle = `rgba(255,250,235,${(0.15 + rnd() * 0.6) * tw * (1 - dawn)})`; G.fillRect(Math.floor(x), Math.floor(y), 1, 1); }
  // cidade celestial
  const cx = 500, cy = 170;
  const halo = G.createRadialGradient(cx, cy, 0, cx, cy, 120);
  halo.addColorStop(0, 'rgba(255,236,180,0.55)'); halo.addColorStop(1, 'rgba(255,236,180,0)');
  G.fillStyle = halo; G.fillRect(cx - 120, cy - 120, 240, 240);
  G.fillStyle = '#ffe9b0';
  const towers = [[-40, 26], [-28, 40], [-14, 32], [0, 52], [14, 34], [28, 42], [40, 24]];
  for (const [dx, h] of towers) { G.fillRect(cx + dx - 5, cy + 10 - h, 10, h); G.fillRect(cx + dx - 2, cy + 6 - h, 4, 4); }
  G.fillStyle = '#fff8e0'; G.fillRect(cx - 48, cy + 6, 96, 6);
  for (let i = 0; i < 12; i++) { G.fillStyle = 'rgba(255,200,120,0.9)'; G.fillRect(cx - 40 + i * 7, cy - 6 - (i % 3) * 8, 2, 3); }
  // colinas
  G.fillStyle = mixHex('#1a1630', '#5a3a3a', dawn);
  G.beginPath(); G.moveTo(0, 250); G.quadraticCurveTo(160, 200, 330, 238); G.quadraticCurveTo(470, 182, 640, 214); G.lineTo(640, H); G.lineTo(0, H); G.fill();
  G.fillStyle = mixHex('#120f22', '#3a2828', dawn);
  G.beginPath(); G.moveTo(0, 300); G.quadraticCurveTo(200, 262, 380, 296); G.quadraticCurveTo(520, 270, 640, 288); G.lineTo(640, H); G.lineTo(0, H); G.fill();
  // caminho estreito
  const path = [];
  for (let i = 0; i <= 60; i++) { const k = i / 60; path.push([lerp(30, cx, k) + Math.sin(k * 9) * 30 * (1 - k), lerp(352, cy + 12, Math.pow(k, 0.8))]); }
  for (let i = 0; i < path.length; i++) { const [x, y] = path[i]; const w = Math.max(1, Math.round(6 * (1 - i / 60))); G.fillStyle = `rgba(255,236,180,${0.25 + 0.5 * (i / 60)})`; G.fillRect(Math.round(x - w / 2), Math.round(y), w, 2); }
  if (walkers) {
    walkers.forEach((ci, j) => {
      const k = mod(t * 0.0012 + j * 0.035, 0.5) + 0.05; const idx = Math.floor(k * 60); const [x, y] = path[idx];
      const ch = CHARACTERS[ci]; const s = 1 - k * 0.8;
      const hgt = Math.max(3, Math.round(14 * s));
      G.fillStyle = ch.pal.tunic; G.fillRect(Math.round(x), Math.round(y - hgt), Math.max(2, Math.round(5 * s)), hgt);
      G.fillStyle = ch.pal.skin; G.fillRect(Math.round(x), Math.round(y - hgt - Math.max(2, 4 * s)), Math.max(2, Math.round(4 * s)), Math.max(2, Math.round(4 * s)));
    });
  }
}

const SPRITE_SCALES = [1, 1.2, 1.25, 1.3];
class TitleScene {
  constructor(game) { this.game = game; this.t = 0; this.sel = 0; this.view = null; this.confirm = false; Music.play('title'); }
  items() {
    const it = [];
    if (Save.data.started) it.push({ id: 'cont', label: t('continueJourney') }, { id: 'new', label: t('newJourney') });
    else it.push({ id: 'new', label: t('startJourney') });
    it.push({ id: 'lang', label: t('language') });
    it.push({ id: 'size', label: t('spriteSize', Math.round(SPRITE_SCALE * 100) + '%') });
    it.push({ id: 'ctrl', label: t('controls') }, { id: 'about', label: t('about') });
    return it;
  }
  update() {
    this.t++;
    const nv = Input.nav();
    if (this.view) { if (nv.ok || nv.cancel) { this.view = null; Snd.play('back'); } return; }
    if (this.confirm) {
      if (nv.left || nv.right || nv.up || nv.down) { this.cSel = 1 - (this.cSel || 0); Snd.play('menu'); }
      if (nv.cancel) { this.confirm = false; Snd.play('back'); }
      if (nv.ok) { if (this.cSel === 1) { Save.reset(); this.game.toSelect('diff'); } this.confirm = false; Snd.play('ok'); }
      return;
    }
    const items = this.items();
    if (nv.up) { this.sel = mod(this.sel - 1, items.length); Snd.play('menu'); }
    if (nv.down) { this.sel = mod(this.sel + 1, items.length); Snd.play('menu'); }
    const it = items[this.sel];
    if (it.id === 'lang' && (nv.left || nv.right)) { this.game.setLang(LANG === 'pt' ? 'en' : 'pt'); Snd.play('menu'); return; }
    if (it.id === 'size' && (nv.left || nv.right)) { this.game.cycleSpriteScale(nv.left ? -1 : 1); Snd.play('menu'); return; }
    if (nv.ok) {
      Snd.play('ok');
      if (it.id === 'cont') this.game.toSelect('map');
      else if (it.id === 'new') { if (Save.data.started) { this.confirm = true; this.cSel = 0; } else { Save.reset(); this.game.toSelect('diff'); } }
      else if (it.id === 'lang') this.game.setLang(LANG === 'pt' ? 'en' : 'pt');
      else if (it.id === 'size') this.game.cycleSpriteScale(1);
      else this.view = it.id;
    }
  }
  draw() { resetG(); drawJourneyBackdrop(this.t, 0, [0, 1, 2, 3]); }
  drawUI() {
    if (this.view === 'ctrl') { U.save(); U.fillStyle = 'rgba(5,4,10,0.85)'; U.fillRect(0, 0, W, H); U.restore(); drawControlsTable(); return; }
    if (this.view === 'about') { drawAbout(); return; }
    const a = Math.min(1, this.t / 60);
    txt(t('gameTitle'), 40, 46, { size: 46, font: FONT_TITLE, weight: 700, color: '#fff3d6', alpha: a, glow: 'rgba(255,214,140,0.7)', glowSize: 14 });
    txt(t('gameSub'), 44, 98, { size: 15, font: FONT_TITLE, weight: 600, color: '#e8c070', alpha: a });
    txt(t('titleVerse'), 44, 120, { size: 7.5, color: '#c8c0d8', alpha: a });
    const items = this.items();
    items.forEach((it, i) => {
      const sel = i === this.sel, arrows = sel && (it.id === 'lang' || it.id === 'size');
      txt((sel ? '› ' : '  ') + it.label + (arrows ? '  ‹ ›' : ''), 48, 150 + i * 18, { size: 11, color: sel ? '#ffe08a' : '#d8d0e8', weight: sel ? 700 : 500, alpha: a });
    });
    txt(t('titleFoot1'), 44, H - 30, { size: 7, color: '#8a84a0', alpha: a });
    txt(t('titleFoot2'), 44, H - 19, { size: 7, color: '#8a84a0', alpha: a });
    if (this.confirm) {
      panel(W / 2 - 150, H / 2 - 40, 300, 80, { fill: 'rgba(20,14,30,0.97)' });
      txt(t('eraseWarn'), W / 2, H / 2 - 28, { size: 9, align: 'center' });
      [t('keepJourney'), t('eraseJourney')].forEach((l, i) => txt((this.cSel === i ? '› ' : '') + l, W / 2, H / 2 - 4 + i * 18, { size: 10, align: 'center', color: this.cSel === i ? '#ffe08a' : '#d8d0e8', weight: 600 }));
    }
  }
}
function drawAbout() {
  U.save(); U.fillStyle = 'rgba(5,4,10,0.9)'; U.fillRect(0, 0, W, H); U.restore();
  txt(t('aboutTitle'), W / 2, 22, { size: 16, align: 'center', font: FONT_TITLE, weight: 700, color: '#fff3d6' });
  let y = 50;
  for (const k of ['about1', 'about2', 'about3', 'about4']) { const ls = wrapText(t(k), 520, 8); ls.forEach(l => { txt(l, 60, y, { size: 8, color: '#e4dcf0' }); y += 11; }); y += 7; }

}
function devLabel(id) {

class SelectScene {
  constructor(game, next) {
    this.game = game; this.next = next; this.t = 0; this.slots = []; this.count = 0;
    this.dummies = CHARACTERS.map((c, i) => { const d = new Player(0, i, null, { diff: DIFFS[1] }); d.grounded = true; return d; });
    if (game.party) for (const m of game.party) { if (Input.devs[m.dev] && Input.devs[m.dev].connected !== false && m.ci < CHARACTERS.length) this.slots.push({ dev: m.dev, ci: m.ci, ready: false, t: 0 }); }
    Music.play('title');
  }
  taken(ci, except) { return this.slots.some(s => s !== except && s.ci === ci); }
  update() {
    this.t++;
    for (const d of Input.list()) {

    let y = H + 10 - this.t * 0.35;
    for (const [l, k] of this.lines) {
      if (y > -20 && y < H + 10) {
        const a = clamp(Math.min((H - y) / 40, (y + 10) / 40), 0, 1);
        if (k === 'h') txt(l, W / 2, y, { size: 14, align: 'center', font: FONT_TITLE, weight: 700, color: '#fff3d6', alpha: a, glow: 'rgba(255,220,160,0.6)' });
        else if (k === 'v') txt(l, W / 2, y, { size: 8, align: 'center', color: '#ffe8b8', alpha: a });
        else txt(l, W / 2, y, { size: 8, align: 'center', color: '#e4dcf0', alpha: a });
      }
      y += k === 'h' ? 26 : 16;
    }
    if (this.t > 120) txt(t('endBack'), W - 14, H - 14, { size: 7, align: 'right', color: '#c8c0d8', alpha: 0.7 });
  }
}

// ---- 13_main.js ----
// ============================================================
//  Gerente de cenas, laço principal e inicialização
// ============================================================
const Game = {
  scene: null, party: null, captiveTotals: [],
  init() {
    Save.load();
    let lang = Save.data.lang;
    if (!lang) { try { lang = /^pt/i.test(navigator.language || '') ? 'pt' : 'en'; } catch (e) { lang = 'pt'; } }
    applyLang(lang); this.updateStartText();
    if (SPRITE_SCALES.includes(Save.data.spriteScale)) SPRITE_SCALE = Save.data.spriteScale;
    this.captiveTotals = PHASES.map((_, i) => buildLevel(i).captiveCount);
    if (Save.data.party) this.party = Save.data.party;
    this.scene = new TitleScene(this);
  },
  semelhanca() {
    let s = 0;
    for (let i = 0; i < 5; i++) {
      const ps = Save.data.phases[i], tot = this.captiveTotals[i] || 1;
      s += (ps.boss ? 4 : 0) + Math.min(3, ps.scrolls.length) * 3 + Math.min(1, ps.captives.length / tot) * 7;
    }
    return clamp(s, 0, 100);
  },
  validParty() {
    if (!this.party) return null;
    const p = this.party.filter(m => Input.devs[m.dev] && Input.devs[m.dev].connected !== false);
    return p.length ? p : null;
  },
  setLang(l) { applyLang(l); Save.data.lang = LANG; Save.write(); this.updateStartText(); },
  cycleSpriteScale(dir) {
    const i = SPRITE_SCALES.indexOf(SPRITE_SCALE);
    SPRITE_SCALE = SPRITE_SCALES[mod((i < 0 ? 2 : i) + dir, SPRITE_SCALES.length)];
    Save.data.spriteScale = SPRITE_SCALE; Save.write();
  },
  updateStartText() {
    try {
      const st = document.getElementById('start'); if (!st) return;
      st.querySelector('h1').textContent = t('gameTitle');
      st.querySelector('.sub').textContent = t('gameSub');
      st.querySelector('.go').textContent = t('startClick');
      st.querySelector('.note').textContent = t('startNote');
    } catch (e) { }
  },
  toTitle() { this.scene = new TitleScene(this); },
  toSelect(next) { this.scene = new SelectScene(this, next); },
  toDifficulty() { this.scene = new DifficultyScene(this); },
  toMap() { this.scene = new MapScene(this); },
  startPhase(i) {
    const party = this.validParty();
    if (!party) { this.toSelect('map'); return; }
    this.party = party;
    this.scene = new PlayScene(this, i, party);
  },
  toSummary(play) { this.scene = new SummaryScene(this, play); },
  toEnding() { this.scene = new EndingScene(this); },
};

(function boot() {
  const gc = document.getElementById('game'), uc = document.getElementById('ui'), stage = document.getElementById('stage');
  G = gc.getContext('2d'); U = uc.getContext('2d');
  G.imageSmoothingEnabled = false;
  let uiScale = 1;
  function resize() {
    const ww = window.innerWidth, wh = window.innerHeight;
    let s = Math.min(ww / W, wh / H);
    const fs = Math.floor(s);
    if (fs >= 2 && s - fs < 0.3) s = fs;
    const cw = Math.max(1, Math.floor(W * s)), ch = Math.max(1, Math.floor(H * s));
    for (const c of [gc, uc]) { c.style.width = cw + 'px'; c.style.height = ch + 'px'; }
    stage.style.width = cw + 'px'; stage.style.height = ch + 'px';
    const dpr = window.devicePixelRatio || 1;
    uc.width = Math.round(cw * dpr); uc.height = Math.round(ch * dpr);
    uiScale = uc.width / W;
    // resolução interna inteira próxima da tela: sprites ampliados continuam nítidos
    RES = clamp(Math.round(s * dpr), 1, 4);
    if (gc.width !== W * RES) { gc.width = W * RES; gc.height = H * RES; }
    G.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', resize); resize();
  Input.init();
  Game.init();
  const start = document.getElementById('start');
  const begin = () => { Snd.unlock(); if (start) start.hidden = true; try { window.focus(); } catch (e) { } };
  if (start) { start.addEventListener('click', begin); window.addEventListener('keydown', begin, { once: true }); }
  let acc = 0, last = performance.now();
  const STEP = 1 / 60;
  function render() {
    resetG();
    Game.scene.draw();
    U.setTransform(1, 0, 0, 1, 0, 0); U.clearRect(0, 0, uc.width, uc.height);
    U.setTransform(uiScale, 0, 0, uiScale, 0, 0);
    if (Game.scene.drawUI) Game.scene.drawUI();
  }
  function frame(now) {
    acc += Math.min(0.1, (now - last) / 1000); last = now;
    let steps = 0;
    while (acc >= STEP && steps < 5) {
      Input.poll();
      try { Game.scene.update(); } catch (e) { console.error(e); }
      acc -= STEP; steps++;
    }
    if (steps >= 5) acc = 0;
    try { render(); } catch (e) { console.error(e); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  // gancho para testes automatizados
  window.__peregrinos = {
    Game, Save, Input, PHASES, get LV() { return LV; },
    step(n = 1) { for (let i = 0; i < n; i++) { Input.poll(); Game.scene.update(); } render(); },
    warp(r) {
      const sc = Game.scene; if (!(sc instanceof PlayScene)) return;
      sc.lock = null; sc.lockB = null; sc.boss = null;
      for (const room of LV.rooms) if (room.i < r && (room.type === 'arena' || room.type === 'boss')) room.state = 'done';
      sc.enemies = sc.enemies.filter(e => !e.wave); sc.projs = [];
      const room = LV.rooms[r];
      for (const p of sc.players) { p.x = room.x0 + 24 + p.slot * 12; p.y = 19 * TS - p.h - 1; p.vx = 0; p.vy = 0; p.rx = 0; p.ry = 0; p.state = 'alive'; p.hp = p.maxHp; }
      sc.cam = clamp(room.x0, 0, LV.w - W);
    },
  };
})();
