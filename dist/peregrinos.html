<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peregrinos</title>
<meta name="description" content="Plataforma cooperativa cristã para 1 a 4 jogadores: vença os pecados, colha os Frutos do Espírito e cresça em semelhança com Cristo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Uma única aparência noturna: o jogo vive num céu escuro em qualquer tema. */
  :root { color-scheme: dark; --bg: #07060b; --ink: #f4efe4; --muted: #c8c0d8; --gold: #e8c070; --glow: rgba(255, 214, 140, .55); }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  #stage { position: relative; }
  #game, #ui { position: absolute; left: 0; top: 0; display: block; }
  #game { image-rendering: pixelated; image-rendering: crisp-edges; }
  #ui { pointer-events: none; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(ellipse at 70% 40%, rgba(255, 220, 150, .12), transparent 60%), rgba(7, 6, 11, .94);
    cursor: pointer; text-align: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #start h1 { font-family: "Cinzel", Georgia, serif; font-weight: 700; font-size: clamp(30px, 8vw, 72px); letter-spacing: .08em; margin: 0; color: #fff3d6; text-shadow: 0 0 22px var(--glow); text-wrap: balance; }
  #start .sub { font-family: "Cinzel", Georgia, serif; color: var(--gold); font-size: clamp(14px, 2.6vw, 22px); margin: 0; }
  #start .go { font-family: "Pixelify Sans", system-ui, sans-serif; color: var(--ink); font-size: clamp(13px, 2vw, 17px); margin: 10px 0 0; padding: 8px 18px; border: 1px solid rgba(232, 192, 112, .6); border-radius: 3px; }
  #start .note { font-family: "Pixelify Sans", system-ui, sans-serif; color: var(--muted); font-size: 13px; max-width: 46ch; margin: 0; line-height: 1.45; }
  #start[hidden] { display: none; }
  #start:focus-visible { outline: 2px solid var(--gold); outline-offset: -6px; }
  @media (prefers-reduced-motion: no-preference) { #start .go { animation: pulse 1.6s ease-in-out infinite; } }
  @keyframes pulse { 50% { opacity: .55; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="640" height="360"></canvas>
    <canvas id="ui"></canvas>
  </div>
</div>
<div id="start" tabindex="0" role="button" aria-label="Começar">
  <h1>PEREGRINOS</h1>
  <p class="sub">O Caminho Estreito</p>
  <p class="go">Clique ou pressione uma tecla para começar</p>
  <p class="note">Jogue com teclado (até 2 pessoas) ou controles (até 4). Com som: use fones ou caixas de som.</p>
</div>
<script>
// ---- 00_core.js ----
'use strict';
// ============================================================
//  PEREGRINOS — O Caminho Estreito
//  Núcleo: constantes, utilidades, desenho em pixel, save
// ============================================================

const W = 640, H = 360;          // resolução interna
const TS = 16;                    // tamanho do tile
const ROWS = 22;                  // altura do mundo em tiles
const WORLD_H = ROWS * TS;        // 352 px (o mundo "dá a volta" verticalmente)
const OY = 4;                     // deslocamento vertical do mundo na tela
const RCOLS = 40;                 // largura de uma sala em tiles
const ROOM_W = RCOLS * TS;        // 640 px

let REDUCED_MOTION = false;
try { REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { }
const T_EMPTY = 0, T_SOLID = 1, T_ONEWAY = 2, T_SPIKE = 3, T_BREAK = 4, T_FAKE = 5;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const mod = (a, n) => ((a % n) + n) % n;
const wrapDY = dy => mod(dy + WORLD_H / 2, WORLD_H) - WORLD_H / 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// sobreposição de retângulos considerando a volta vertical do mundo
function overlapR(ax, ay, aw, ah, bx, by, bw, bh) {
  if (ax + aw <= bx || bx + bw <= ax) return false;
  const dy = wrapDY((ay + ah / 2) - (by + bh / 2));
  return Math.abs(dy) < (ah + bh) / 2;
}
function overlap(a, b) { return overlapR(a.x, a.y, a.w, a.h, b.x, b.y, b.w, b.h); }
const ecx = e => e.x + e.w / 2;
const ecy = e => e.y + e.h / 2;
function edist(a, b) { return Math.hypot(ecx(b) - ecx(a), wrapDY(ecy(b) - ecy(a))); }
function angTo(a, b) { return Math.atan2(wrapDY(ecy(b) - ecy(a)), ecx(b) - ecx(a)); }

// ------------------------------------------------------------
// Desenho em pixel (contexto global G = jogo, U = interface)
// ------------------------------------------------------------
let G = null, U = null;
let RES = 2;              // pixels do canvas por pixel do jogo (ajustado à tela)
let SPRITE_SCALE = 1.25;  // escala de personagens e inimigos (opção do jogo)
function resetG() { G.setTransform(RES, 0, 0, RES, 0, 0); G.globalAlpha = 1; G.imageSmoothingEnabled = false; }

// Desenha um sprite num buffer em tamanho original e o amplia sem borrar.
// (ax, ay) = âncora no mundo (centro dos pés); fn(bx, by) desenha com a âncora em (bx, by).
const SPRBUF = { c: null, x: null, size: 128, ax: 64, ay: 96 };
function spriteDraw(ax, ay, fn) {
  const S = SPRITE_SCALE;
  if (S === 1) { fn(Math.round(ax), Math.round(ay)); return; }
  if (!SPRBUF.c) { SPRBUF.c = document.createElement('canvas'); SPRBUF.c.width = SPRBUF.c.height = SPRBUF.size; SPRBUF.x = SPRBUF.c.getContext('2d'); }
  const main = G, a = main.globalAlpha;
  G = SPRBUF.x; G.setTransform(1, 0, 0, 1, 0, 0); G.globalAlpha = 1; G.clearRect(0, 0, SPRBUF.size, SPRBUF.size);
  try { fn(SPRBUF.ax, SPRBUF.ay); } finally { G = main; }
  const dx = Math.round((ax - SPRBUF.ax * S) * RES) / RES, dy = Math.round((ay - SPRBUF.ay * S) * RES) / RES;
  G.globalAlpha = a;
  G.drawImage(SPRBUF.c, dx, dy, SPRBUF.size * S, SPRBUF.size * S);
}

function R(x, y, w, h, c) { G.fillStyle = c; G.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function circ(x, y, r, c) {
  x = Math.round(x); y = Math.round(y); r = Math.max(0, Math.round(r));
  G.fillStyle = c;
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.floor(Math.sqrt(r * r - dy * dy) + 0.5);
    G.fillRect(x - w, y + dy, 2 * w + 1, 1);
  }
}
function ellipse(x, y, rx, ry, c) {
  x = Math.round(x); y = Math.round(y); rx = Math.max(0, Math.round(rx)); ry = Math.max(1, Math.round(ry));
  G.fillStyle = c;
  for (let dy = -ry; dy <= ry; dy++) {
    const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry))));
    G.fillRect(x - w, y + dy, 2 * w + 1, 1);
  }
}
function ring(x, y, r, c, th = 1) {
  x = Math.round(x); y = Math.round(y);
  G.fillStyle = c;
  const steps = Math.max(12, Math.floor(r * 6));
  for (let i = 0; i < steps; i++) {
    const a = i / steps * Math.PI * 2;
    G.fillRect(Math.round(x + Math.cos(a) * r), Math.round(y + Math.sin(a) * r), th, th);
  }
}
function line(x0, y0, x1, y1, c, th = 1) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  G.fillStyle = c;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy, n = 0;
  while (n++ < 400) {
    G.fillRect(x0, y0, th, th);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function hexToRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function shade(hex, amt) { // amt -1..1
  const [r, g, b] = hexToRgb(hex);
  const f = v => clamp(Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt)), 0, 255);
  return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}
function rgba(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }
function mixHex(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return '#' + A.map((v, i) => Math.round(lerp(v, B[i], t)).toString(16).padStart(2, '0')).join('');
}

// Ícones em pixel (padrões de texto)
const ICONS = {
  heart: ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'],
  heartE: ['.##.##.', '#..#..#', '#.....#', '.#...#.', '..#.#..', '...#...'],
  amor: ['.##.##.', '#######', '#######', '#######', '.#####.', '..###..', '...#...'],
  alegria: ['...#...', '.#.#.#.', '..###..', '#######', '..###..', '.#.#.#.', '...#...'],
  paz: ['#######', '#.....#', '#..#..#', '#.###.#', '.#.#.#.', '..#.#..', '...#...'],
  longanimidade: ['.##.##.', '#..#..#', '...#...', '...#...', '..###..', '.#####.', '.#####.'],
  benignidade: ['.#...#.', '###.###', '.#####.', '..#.#..', '.#####.', '###.###', '.#...#.'],
  bondade: ['...#...', '...#...', '.#####.', '#######', '.#####.', '...#...', '...#...'],
  fidelidade: ['..###..', '...#...', '.#####.', '...#...', '#..#..#', '##.#.##', '.#####.'],
  mansidao: ['...#...', '..###..', '.#####.', '#######', '#######', '.#####.', '..###..'],
  dominio: ['...###.', '..###..', '.###...', '#######', '...###.', '..###..', '.###...'],
  shofar: ['......#', '.....##', '######.', '.....##', '......#'],
  scroll: ['.#####.', '#.....#', '.#####.', '.#...#.', '.#####.', '#.....#', '.#####.'],
  person: ['..##..', '..##..', '.####.', '#.##.#', '..##..', '.#..#.'],
  star: ['..#..', '.###.', '#####', '.###.', '..#..'],
  fe: ['#.....#', '##...##', '.##.##.', '..###..', '...#...', '...#...', '..###..'],
  cura: ['..###..', '..###..', '#######', '#######', '#######', '..###..', '..###..'],
  sabedoria: ['......#', '.....#.', '....#..', '...#...', '#.#....', '.#.....', '#.#....'],
  discernimento: ['..###..', '.#...#.', '#..#..#', '#.###.#', '#..#..#', '.#...#.', '..###..'],
};
function drawIcon(name, x, y, color, s = 1) {
  const p = ICONS[name]; if (!p) return;
  G.fillStyle = color;
  for (let j = 0; j < p.length; j++) for (let i = 0; i < p[j].length; i++)
    if (p[j][i] === '#') G.fillRect(Math.round(x) + i * s, Math.round(y) + j * s, s, s);
}

// ------------------------------------------------------------
// Texto nítido na camada de interface (coordenadas do jogo)
// ------------------------------------------------------------
const FONT_UI = '"Pixelify Sans", "Trebuchet MS", system-ui, sans-serif';
const FONT_TITLE = '"Cinzel", "Palatino Linotype", Georgia, serif';
function txt(s, x, y, o = {}) {
  const size = o.size || 8;
  U.save();
  U.globalAlpha = o.alpha == null ? 1 : o.alpha;
  U.font = `${o.weight || 500} ${size}px ${o.font || FONT_UI}`;
  U.textAlign = o.align || 'left';
  U.textBaseline = o.base || 'top';
  if (o.shadow !== false) {
    U.lineJoin = 'round';
    U.strokeStyle = o.stroke || 'rgba(8,6,14,0.9)';
    U.lineWidth = o.lw || Math.max(1.5, size / 5);
    U.strokeText(s, x, y);
  }
  if (o.glow) { U.shadowColor = o.glow; U.shadowBlur = o.glowSize || 8; }
  U.fillStyle = o.color || '#f4efe4';
  U.fillText(s, x, y);
  U.restore();
}
function txtW(s, size = 8, font = FONT_UI, weight = 500) {
  U.save(); U.font = `${weight} ${size}px ${font}`; const w = U.measureText(s).width; U.restore(); return w;
}
function wrapText(s, maxW, size = 8, font = FONT_UI, weight = 500) {
  const words = s.split(' '); const lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (txtW(t, size, font, weight) > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function panel(x, y, w, h, o = {}) {
  U.save();
  U.globalAlpha = o.alpha == null ? 1 : o.alpha;
  U.fillStyle = o.fill || 'rgba(14,11,24,0.88)';
  U.strokeStyle = o.border || 'rgba(233,208,140,0.7)';
  U.lineWidth = o.lw || 1;
  U.beginPath();
  const r = o.r == null ? 3 : o.r;
  U.moveTo(x + r, y); U.arcTo(x + w, y, x + w, y + h, r); U.arcTo(x + w, y + h, x, y + h, r);
  U.arcTo(x, y + h, x, y, r); U.arcTo(x, y, x + w, y, r); U.closePath();
  U.fill(); if (o.border !== 'none') U.stroke();
  U.restore();
}

// ------------------------------------------------------------
// Salvamento (localStorage, sempre protegido)
// ------------------------------------------------------------
const SAVE_KEY = 'peregrinos_caminho_estreito_v1';
const Save = {
  data: null,
  fresh() {
    return {
      v: 1, started: false, diff: 1, unlocked: 1, lang: null, spriteScale: 1.25,
      phases: [0, 1, 2, 3, 4].map(() => ({ done: false, boss: false, scrolls: [], captives: [], best: 0 })),
      gifts: [], fruitsSeen: [], party: null, ending: false,
    };
  },
  load() {
    this.data = this.fresh();
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && d.v === 1) this.data = Object.assign(this.fresh(), d);
      }
    } catch (e) { /* sem armazenamento: segue sem salvar */ }
  },
  write() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { } },
  reset() { const keep = this.data ? { lang: this.data.lang, spriteScale: this.data.spriteScale } : {}; this.data = Object.assign(this.fresh(), keep); this.write(); },
  hasGift(g) { return this.data.gifts.includes(g); },
};

// ---- 01_input.js ----
// ============================================================
//  Entrada: até 2 jogadores no teclado + até 4 controles
// ============================================================
const KEYMAP = {
  kb1: {
    l: ['KeyA'], r: ['KeyD'], u: ['KeyW'], d: ['KeyS'],
    jump: ['KeyJ', 'Space'], sword: ['KeyK'], shoot: ['KeyL'], dash: ['Semicolon', 'ShiftLeft'],
    swap: ['KeyU', 'KeyQ'], special: ['KeyI', 'KeyE'],
    start: ['Escape'], ok: ['KeyJ', 'Space', 'Enter'], cancel: ['Escape', 'Backspace'],
  },
  kb2: {
    l: ['ArrowLeft'], r: ['ArrowRight'], u: ['ArrowUp'], d: ['ArrowDown'],
    jump: ['Numpad1', 'KeyZ'], sword: ['Numpad2', 'KeyX'], shoot: ['Numpad3', 'KeyC'], dash: ['Numpad0', 'KeyV'],
    swap: ['Numpad4', 'KeyB'], special: ['Numpad5', 'KeyN'],
    start: ['NumpadAdd'], ok: ['Numpad1', 'KeyZ', 'NumpadEnter'], cancel: ['NumpadDecimal'],
  },
};
const PREVENT_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'Backspace']);
const ACTIONS = ['l', 'r', 'u', 'd', 'jump', 'sword', 'shoot', 'dash', 'swap', 'special', 'start', 'ok', 'cancel'];

const Input = {
  keys: {}, jd: {}, devs: {}, anyKeyHook: null,
  init() {
    addEventListener('keydown', e => {
      if (e.repeat) { if (PREVENT_KEYS.has(e.code)) e.preventDefault(); return; }
      this.jd[e.code] = true; this.keys[e.code] = true;
      if (PREVENT_KEYS.has(e.code)) e.preventDefault();
      if (e.code === 'KeyM') { Music.toggle(); }
      Snd.unlock();
    });
    addEventListener('keyup', e => { this.keys[e.code] = false; });
    addEventListener('blur', () => { this.keys = {}; });
    addEventListener('gamepadconnected', () => Snd.unlock());
    this.devs.kb1 = { id: 'kb1', label: 'Teclado 1', kind: 'kb', cur: {}, prev: {} };
    this.devs.kb2 = { id: 'kb2', label: 'Teclado 2', kind: 'kb', cur: {}, prev: {} };
  },
  poll() {
    for (const id of ['kb1', 'kb2']) {
      const d = this.devs[id], m = KEYMAP[id];
      d.prev = d.cur; const c = {};
      for (const a in m) c[a] = m[a].some(k => this.keys[k] || this.jd[k]);
      d.cur = c;
    }
    this.jd = {};
    let pads = [];
    try { pads = navigator.getGamepads ? navigator.getGamepads() : []; } catch (e) { pads = []; }
    for (let i = 0; i < 4; i++) {
      const gp = pads[i]; const id = 'pad' + i;
      if (!gp || !gp.connected) { if (this.devs[id]) this.devs[id].connected = false; continue; }
      let d = this.devs[id];
      if (!d) d = this.devs[id] = { id, label: 'Controle ' + (i + 1), kind: 'pad', cur: {}, prev: {} };
      d.connected = true; d.prev = d.cur;
      const b = k => !!(gp.buttons[k] && (gp.buttons[k].pressed || gp.buttons[k].value > 0.5));
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      d.cur = {
        l: b(14) || ax < -0.4, r: b(15) || ax > 0.4, u: b(12) || ay < -0.5, d: b(13) || ay > 0.5,
        jump: b(0), shoot: b(1), sword: b(2), swap: b(3), special: b(4) || b(6), dash: b(5) || b(7),
        start: b(9), ok: b(0) || b(9), cancel: b(1) || b(8),
      };
    }
  },
  held(d, a) { return !!(d && d.cur[a]); },
  pressed(d, a) { return !!(d && d.cur[a] && !d.prev[a]); },
  list() { return Object.values(this.devs).filter(d => d.connected !== false); },
  anyPressed(a) {
    for (const d of this.list()) if (this.pressed(d, a)) return d;
    return null;
  },
  anyHeld(a) { for (const d of this.list()) if (this.held(d, a)) return d; return null; },
  // navegação de menu: qualquer dispositivo
  nav() {
    return {
      up: !!this.anyPressed('u'), down: !!this.anyPressed('d'),
      left: !!this.anyPressed('l'), right: !!this.anyPressed('r'),
      ok: !!this.anyPressed('ok'), cancel: !!this.anyPressed('cancel'),
    };
  },
};

// Rótulos de controle mostrados nas telas
const CONTROL_LABELS = {
  kb1: { move: 'W A S D', jump: 'J / Espaço', sword: 'K', shoot: 'L', dash: 'Ç (;) / Shift esq.', swap: 'U / Q', special: 'I / E', start: 'Esc' },
  kb2: { move: 'Setas', jump: 'Num 1 / Z', sword: 'Num 2 / X', shoot: 'Num 3 / C', dash: 'Num 0 / V', swap: 'Num 4 / B', special: 'Num 5 / N', start: 'Num + / Esc' },
  pad: { move: 'Analógico / D-pad', jump: 'A', sword: 'X', shoot: 'B', dash: 'RB / RT', swap: 'Y', special: 'LB / LT', start: 'Start' },
};

// ---- 02_audio.js ----
// ============================================================
//  Áudio: efeitos sintetizados + músicas chiptune
//  Hinos usados (domínio público): "Old Hundredth" (Doxologia,
//  L. Bourgeois, 1551) e "New Britain" (Amazing Grace, 1829).
// ============================================================
const Snd = {
  ctx: null, master: null, sfx: null, mus: null, noiseBuf: null, pulse: {}, last: {}, sfxOn: true,
  unlock() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain(); this.master.gain.value = 0.85; this.master.connect(this.ctx.destination);
        this.sfx = this.ctx.createGain(); this.sfx.gain.value = 0.55; this.sfx.connect(this.master);
        this.mus = this.ctx.createGain(); this.mus.gain.value = Music.on ? 0.2 : 0; this.mus.connect(this.master);
        const len = this.ctx.sampleRate;
        const b = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = b.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

const FRUIT_IDS = Object.keys(FRUITS);
function randomFruit(exclude) {
  const ids = FRUIT_IDS.filter(f => f !== exclude);
  let tot = ids.reduce((s, f) => s + FRUITS[f].w, 0), r = Math.random() * tot;
  for (const f of ids) { r -= FRUITS[f].w; if (r <= 0) return f; }
  return ids[0];
}

// Aplica o idioma: guarda uma cópia do português na primeira chamada
let I18N_PT = null;
function i18nTargets() {
  return { CHARACTERS, RANGED, FRUITS, GIFTS, DIFFS, STAGES, ETYPES, PHASES, TUTORIAL_SIGNS, ACCUSATIONS, CONTROL_LABELS };
}
function i18nPick(src, shape) {
  if (Array.isArray(shape)) return shape.map((v, i) => i18nPick(src[i], v));
  if (shape && typeof shape === 'object') { const o = {}; for (const k in shape) o[k] = i18nPick(src[k], shape[k]); return o; }
  return src;
}
function i18nAssign(dst, src) {
  if (Array.isArray(src)) { src.forEach((v, i) => { if (v && typeof v === 'object') i18nAssign(dst[i], v); else dst[i] = v; }); return; }
  for (const k in src) { const v = src[k]; if (v && typeof v === 'object') i18nAssign(dst[k], v); else dst[k] = v; }
}
function applyLang(lang) {
  const tg = i18nTargets();
  if (!I18N_PT) { I18N_PT = {}; for (const k in I18N_EN) I18N_PT[k] = i18nPick(tg[k], I18N_EN[k]); }
  LANG = lang === 'en' ? 'en' : 'pt';
  const layer = LANG === 'en' ? I18N_EN : I18N_PT;
  for (const k in layer) i18nAssign(tg[k], layer[k]);
  try { document.documentElement.lang = LANG === 'en' ? 'en' : 'pt-BR'; } catch (e) { }
}

// ---- 05_level.js ----
// ============================================================
//  Nível: montagem das salas, colisão com tiles e cache de tiles
// ============================================================
let LV = null; // nível atual

function normRow(r, i) {
  if (r.length > RCOLS) r = r.slice(0, RCOLS);
  while (r.length < RCOLS) r += (i === 0 || i >= 19) ? '#' : '.';
  return r;
}
function roomMap(name) {
  const [id, flag] = name.split(':');
  const tpl = ROOMS[id];
  let rows = tpl.map.map((r, i) => normRow(r, i));
  if (flag === 'm') rows = rows.map(r => r.split('').reverse().join(''));
  return { id, tpl, rows, mirrored: flag === 'm' };
}

function buildLevel(pi) {
  const ph = PHASES[pi];
  const rms = ph.rooms.map(roomMap);
  const cols = rms.length * RCOLS;
  const grid = new Uint8Array(cols * ROWS);
  const L = { pi, ph, cols, grid, w: cols * TS, rooms: [], spawns: [], bhp: new Map(), scrollCount: 0, captiveCount: 0 };
  let scrollK = 0;
  rms.forEach((rm, ri) => {
    const x0 = ri * RCOLS;
    const room = { i: ri, id: rm.id, type: rm.tpl.type, x0: x0 * TS, x1: (x0 + RCOLS) * TS, waves: rm.tpl.waves || null, portals: [], state: 'idle' };
    let hasE = false;
    rm.rows.forEach((row, r) => {
      for (let c = 0; c < RCOLS; c++) {
        const ch = row[c], gc = x0 + c, idx = r * cols + gc;
        let t = T_EMPTY;
        if (ch === '#') t = T_SOLID;
        else if (ch === '=') t = T_ONEWAY;
        else if (ch === '^') t = T_SPIKE;
        else if (ch === '%') { t = T_BREAK; L.bhp.set(idx, 3); }
        else if (ch === '&') t = T_FAKE;
        else if (ch === '*') room.portals.push({ x: gc * TS + 8, y: r * TS + 8 });
        else if ('SECPJHTB123'.includes(ch)) {
          const sp = { ch, c: gc, r, room: ri, id: `${pi}-${ri}-${c}-${r}` };
          if (ch === 'P') { sp.k = scrollK++; }
          if (ch === 'E') hasE = true;
          L.spawns.push(sp);
        }
        grid[idx] = t;
      }
    });
    if (room.type === 'arena' && !hasE) L.spawns.push({ ch: 'E', c: x0 + 1, r: 18, room: ri, id: `${pi}-${ri}-E` });
    L.rooms.push(room);
  });
  // Abertura no teto acima dos buracos do chão (o mundo dá a volta verticalmente)
  for (let c = 0; c < cols; c++) {
    if (grid[(ROWS - 1) * cols + c] === T_EMPTY) {
      for (let r = 0; r < 2; r++) if (grid[r * cols + c] === T_SOLID) grid[r * cols + c] = T_EMPTY;
    }
  }
  L.scrollCount = scrollK;
  L.captiveCount = L.spawns.filter(s => s.ch === 'C').length;
  return L;
}

// ------------------------------------------------------------
// Colisão
// ------------------------------------------------------------
function tileAt(c, r) {
  if (c < 0 || c >= LV.cols) return T_SOLID;
  return LV.grid[mod(r, ROWS) * LV.cols + c];
}
function tileIdx(c, r) { return mod(r, ROWS) * LV.cols + c; }
const isSolidT = t => t === T_SOLID || t === T_BREAK;
function solidRect(x, y, w, h, bnd) {
  if (bnd && (x < bnd.min || x + w > bnd.max)) return true;
  const c0 = Math.floor(x / TS), c1 = Math.floor((x + w - 1) / TS);
  const r0 = Math.floor(y / TS), r1 = Math.floor((y + h - 1) / TS);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (isSolidT(tileAt(c, r))) return true;
  return false;
}
function onewayAt(x, y, w, h) {
  const fy = y + h;
  if (mod(fy, TS) !== 0) return false;
  const r = fy / TS, c0 = Math.floor(x / TS), c1 = Math.floor((x + w - 1) / TS);
  for (let c = c0; c <= c1; c++) if (tileAt(c, r) === T_ONEWAY) return true;
  return false;
}
function pointSolid(px, py) { return isSolidT(tileAt(Math.floor(px / TS), Math.floor(py / TS))); }
function rectHasTile(x, y, w, h, type) {
  const c0 = Math.floor(x / TS), c1 = Math.floor((x + w - 1) / TS);
  const r0 = Math.floor(y / TS), r1 = Math.floor((y + h - 1) / TS);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (tileAt(c, r) === type) return true;
  return false;
}
function moveX(e, amt) {
  e.rx += amt;
  let m = Math.round(e.rx);
  if (m === 0) return false;
  e.rx -= m;
  const s = sign(m);
  while (m !== 0) {
    if (!solidRect(e.x + s, e.y, e.w, e.h, e.bnd)) { e.x += s; m -= s; }
    else { e.rx = 0; return true; }
  }
  return false;
}
function moveY(e, amt) {
  e.ry += amt;
  let m = Math.round(e.ry);
  if (m === 0) return false;
  e.ry -= m;
  const s = sign(m);
  while (m !== 0) {
    const blocked = solidRect(e.x, e.y + s, e.w, e.h, null) || (s > 0 && !e.dropT && onewayAt(e.x, e.y, e.w, e.h));
    if (!blocked) { e.y = mod(e.y + s, WORLD_H); m -= s; }
    else { e.ry = 0; return true; }
  }
  return false;
}
function onGround(e) {
  return solidRect(e.x, e.y + 1, e.w, e.h, null) || (!e.dropT && onewayAt(e.x, e.y, e.w, e.h));
}
function onOnewayOnly(e) { return !solidRect(e.x, e.y + 1, e.w, e.h, null) && onewayAt(e.x, e.y, e.w, e.h); }

// Dano em muralhas frágeis
function damageTile(c, r, d, scene) {
  const t = tileAt(c, r); if (t !== T_BREAK) return false;
  const idx = tileIdx(c, r);
  const hp = (LV.bhp.get(idx) || 3) - d;
  if (hp <= 0) {
    LV.grid[idx] = T_EMPTY; LV.bhp.delete(idx);
    renderTileRegion(LV, c - 1, c + 1);
    if (scene) {
      for (let i = 0; i < 14; i++) scene.part(c * TS + rand(0, 16), mod(r, ROWS) * TS + rand(0, 16), rand(-2, 2), rand(-3, 0.5), LV.ph.theme.tileLight, 40, 2, 0.15);
      Snd.play('break'); scene.shake(3, 8);
    }
  } else {
    LV.bhp.set(idx, hp);
    if (scene) { Snd.play('tink'); for (let i = 0; i < 4; i++) scene.part(c * TS + 8, mod(r, ROWS) * TS + 8, rand(-1.5, 1.5), rand(-2, 0), LV.ph.theme.tileLight, 20, 1, 0.1); }
  }
  return true;
}
function damageTilesInRect(x, y, w, h, d, scene) {
  const c0 = Math.floor(x / TS), c1 = Math.floor((x + w - 1) / TS);
  const r0 = Math.floor(y / TS), r1 = Math.floor((y + h - 1) / TS);
  let hit = false;
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (damageTile(c, r, d, scene)) hit = true;
  return hit;
}

// ------------------------------------------------------------
// Cache de tiles (desenhado uma vez por nível)
// ------------------------------------------------------------
function renderTiles(L) {
  L.canvas = document.createElement('canvas');
  L.canvas.width = L.w; L.canvas.height = WORLD_H;
  L.ctx = L.canvas.getContext('2d');
  renderTileRegion(L, 0, L.cols - 1);
}
function renderTileRegion(L, c0, c1) {
  c0 = Math.max(0, c0); c1 = Math.min(L.cols - 1, c1);
  const ctx = L.ctx;
  ctx.clearRect(c0 * TS, 0, (c1 - c0 + 1) * TS, WORLD_H);
  for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1; c++) {
    const t = L.grid[r * L.cols + c];
    if (t === T_SOLID) drawSolidTile(ctx, L, c, r);
    else if (t === T_ONEWAY) drawOnewayTile(ctx, L, c, r);
    else if (t === T_SPIKE) drawSpikeTile(ctx, L, c, r);
  }
}
function solidLikeAt(L, c, r) {
  if (c < 0 || c >= L.cols) return true;
  const t = L.grid[mod(r, ROWS) * L.cols + c];
  return t === T_SOLID || t === T_BREAK || t === T_FAKE;
}
function drawSolidTile(ctx, L, c, r, alpha) {
  const th = L.ph.theme, x = c * TS, y = r * TS, h = hash2(c, r), bg = th.bg;
  const f = (xx, yy, w, hh, col) => { ctx.fillStyle = col; ctx.fillRect(x + xx, y + yy, w, hh); };
  if (alpha != null) { ctx.save(); ctx.globalAlpha = alpha; }
  f(0, 0, 16, 16, th.tile);
  // textura por tema
  const rnd = mulberry32((c * 7919 + r * 104729) | 0);
  if (bg === 'towers') {
    const off = (r % 2) * 8;
    f(0, 7, 16, 1, th.tileDark); f(0, 15, 16, 1, th.tileDark);
    f(mod(off + 3, 16), 0, 1, 7, th.tileDark); f(mod(off + 11, 16), 8, 1, 7, th.tileDark);
    f(1, 1, 3, 1, th.tileLight);
  } else if (bg === 'shadow') {
    f(0, 15, 16, 1, th.tileDark); f(15, 0, 1, 16, th.tileDark);
    if (h < 0.4) { const cx = 3 + Math.floor(rnd() * 9); f(cx, 3, 1, 4, th.tileDark); f(cx + 1, 7, 1, 3, th.tileDark); }
  } else {
    for (let i = 0; i < 5; i++) f(Math.floor(rnd() * 15), Math.floor(rnd() * 15), 2, 1, rnd() < 0.5 ? th.tileDark : th.tileLight);

// Desenha algo considerando a volta vertical do mundo
function wrapDraw(y, h, fn) {

const EPROJ = {

  doubt: { w: 8, h: 8, speed: 1.25, life: 240, ghost: true, wobble: true },
  venom: { w: 6, h: 6, speed: 2.6, life: 150 },
  wave: { w: 14, h: 14, life: 400, hard: true, ground: true },
  pillow: { w: 12, h: 10, life: 260, grav: 0.16 },
  crown: { w: 14, h: 9, life: 420, hard: true, ghost: true },

  flame: { w: 8, h: 8, speed: 3, life: 42 },

class Proj {
  constructor(o) {
    this.x = 0; this.y = 0; this.w = 4; this.h = 4; this.vx = 0; this.vy = 0; this.grav = 0; this.life = 120; this.t = 0;
    this.dmg = 1; this.owner = 'p'; this.kind = 'arrow'; this.pierce = 0; this.bounce = 0; this.homing = false;
    this.ghost = false; this.hard = false; this.dead = false; this.stuck = 0; this.hitSet = new Set(); this.color = '#fff';
    Object.assign(this, o);
  }
  get cx() { return this.x + this.w / 2; } get cy() { return this.y + this.h / 2; }
}

function spawnEnemyProj(scene, kind, x, y, ang, o = {}) {
  const d = EPROJ[kind];
  const spd = (o.speed || d.speed || 2) * (scene.diff.espd);
  const p = new Proj({
    owner: 'e', kind, w: d.w, h: d.h, x: x - d.w / 2, y: mod(y - d.h / 2, WORLD_H), vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
    grav: d.grav || 0, life: d.life, ghost: !!d.ghost, hard: !!d.hard, wobble: !!d.wobble, ground: !!d.ground, dmg: 1,
  });
  Object.assign(p, o.extra || {});
  if (o.vx != null) p.vx = o.vx; if (o.vy != null) p.vy = o.vy;
  scene.projs.push(p);
  return p;
}

function updateProj(p, sc) {
  if (p.delay > 0) { p.delay--; return; }
  p.t++;
  if (p.t > p.life) { p.dead = true; return; }
  if (p.stuck > 0) {
    if (p.stuckTo) {
      if (p.stuckTo.dead) p.stuckTo = null; else { p.x = p.stuckTo.x + p.sox; p.y = mod(p.stuckTo.y + p.soy, WORLD_H); }
    }
    p.stuck--;
    if (p.kind === 'seed' && p.stuck <= 0) seedExplode(p, sc);
    if (p.stuck <= 0) p.dead = true;
    return;
  }
  if (p.owner === 'p' && p.homing && p.t > 3) {
    if (!p.target || p.target.dead || p.t % 8 === 0) p.target = sc.nearestTarget(p.cx, p.cy, 260);
    if (p.target) {
      const tx = p.target.cx != null ? p.target.cx : ecx(p.target), ty = p.target.cy != null ? p.target.cy : ecy(p.target);
      const want = Math.atan2(wrapDY(ty - p.cy), tx - p.cx);

      let da = mod(want - cur + Math.PI, Math.PI * 2) - Math.PI;
      const na = cur + clamp(da, -0.14, 0.14);
      p.vx = Math.cos(na) * spd; p.vy = Math.sin(na) * spd; p.grav = 0;
    }
  }
  if (p.wobble) { p.vy += Math.sin(p.t * 0.15) * 0.06; }

    // coroa bumerangue: desacelera e retorna ao dono
    const o = p.boomer; if (o.dead) { p.dead = true; return; }
    if (p.t > 40) { const a = Math.atan2(wrapDY(o.cy - p.cy), o.cx - p.cx); p.vx = lerp(p.vx, Math.cos(a) * 4, 0.06); p.vy = lerp(p.vy, Math.sin(a) * 4, 0.06); if (Math.hypot(o.cx - p.cx, wrapDY(o.cy - p.cy)) < 20) p.dead = true; }
  }
  p.vy += p.grav;
  if (p.ground) { // onda que corre pelo chão
    p.x += p.vx;
    if (pointSolid(p.x + p.w / 2 + sign(p.vx) * 8, p.y + p.h / 2) || !pointSolid(p.x + p.w / 2, p.y + p.h + 2)) p.dead = true;
  } else {
    const steps = Math.max(1, Math.ceil(Math.max(Math.abs(p.vx), Math.abs(p.vy)) / 4));
    for (let s = 0; s < steps && !p.dead && !p.stuck; s++) {
      const px = p.x, py = p.y;
      p.x += p.vx / steps; p.y = mod(p.y + p.vy / steps, WORLD_H);
      if (!p.ghost && pointSolid(p.cx, p.cy)) projHitWall(p, sc, px, py);

    p.dead = true; for (let i = 0; i < 5; i++) sc.part(p.cx, FLOOR_Y - 2, rand(-1.5, 1.5), rand(-2, -0.5), p.kind === 'coin' ? '#f2cf5b' : '#7a5448', 18, 2, 0.1);
  }
  if (p.x < sc.cam - 80 || p.x > sc.cam + W + 80) p.dead = true;
  // rastro
  if (p.owner === 'p' && p.t % 2 === 0) {
    const col = p.fruitColor || p.color;
    if (p.kind !== 'arrow' || p.fruitColor) sc.part(p.cx, p.cy, 0, 0, col, 12, 1, 0, 0.6);

}
function projHitWall(p, sc, px, py) {
  const c = Math.floor(p.cx / TS), r = Math.floor(p.cy / TS);
  if (p.owner === 'p' && tileAt(c, r) === T_BREAK) { damageTile(c, r, 1, sc); if (p.kind !== 'light') { p.dead = true; return; } }

    if (p.kind === 'stone' && p.bounce > 0) {

      p.x = px; p.y = py;
      if (hitX || !hitY) p.vx = -p.vx * 0.7;
      if (hitY) p.vy = -p.vy * 0.55;
      Snd.play('tink');
      return;
    }
    if (p.kind === 'arrow' || p.kind === 'lightarrow' || p.kind === 'bolt') { p.x = px; p.y = py; p.stuck = 36; p.stuckWall = true; Snd.play('tink', 0.08); return; }

}
function projHitEnemies(p, sc) {
  const r = { x: p.x, y: p.y, w: p.w, h: p.h };
  for (const e of sc.enemies) {
    if (e.dead || !e.active || p.hitSet.has(e)) continue;
    if (overlap(r, e)) {
      if (p.kind === 'seed') { p.stuck = 48; p.stuckTo = e; p.sox = p.x - e.x; p.soy = p.y - e.y; e.hurt(1, p, sc); p.hitSet.add(e); return; }

    }

  if (sc.boss && !sc.boss.dead && !p.hitSet.has(sc.boss) && sc.boss.hitTest(r)) {
    if (p.kind === 'seed') { p.stuck = 48; p.stuckTo = null; p.hitSet.add(sc.boss); sc.boss.hurt(1, sc); return; }
    sc.boss.hurt(p.dmg, sc);
    p.hitSet.add(sc.boss);
    if (p.pierce > 0) p.pierce--; else { p.dead = true; return; }
  }
  for (const o of sc.objs) {
    if (o.dead || !o.hittable || p.hitSet.has(o)) continue;
    if (overlap(r, o)) { o.hit(sc, p); p.hitSet.add(o); if (p.kind !== 'light') { p.dead = true; return; } }
  }
}

  for (const pl of sc.players) {
    if (pl.state !== 'alive') continue;
    if (overlapR(p.x, p.y, p.w, p.h, pl.x + 1, pl.y + 1, pl.w - 2, pl.h - 2)) {
      if (pl.hurt(sc, p.cx)) { if (!p.hard) p.dead = true; }
      else if (pl.dashT > 0 && !p.hard) { /* atravessou no dash */ }
    }

}
function seedExplode(p, sc) {
  const cx = p.cx, cy = p.cy, R = 30;
  for (const e of sc.enemies) if (!e.dead && e.active && Math.hypot(ecx(e) - cx, wrapDY(ecy(e) - cy)) < R + e.w / 2) e.hurt(3, p, sc);
  if (sc.boss && !sc.boss.dead && sc.boss.hitTest({ x: cx - R, y: cy - R, w: R * 2, h: R * 2 })) sc.boss.hurt(3, sc);

  sc.flashRing(cx, cy, R, '#d9ffb0');

}

function drawProj(p, sc) {
  if (p.warnX != null && !p.dead) { G.globalAlpha = 0.5 + 0.3 * Math.sin(sc.t * 0.5); R(p.warnX - 5, FLOOR_Y - 2, 10, 2, '#ff5a3a'); G.globalAlpha = 1; }
  if (p.delay > 0) return;
  const x = Math.round(p.x), y = Math.round(p.y), k = p.kind;

    const Y = y + oy, cx = x + p.w / 2, cy = Y + p.h / 2;
    const a = Math.atan2(p.vy, p.vx), ca = Math.cos(a), sa = Math.sin(a);

      const fc = p.fruitColor;
      if (k === 'arrow' || k === 'lightarrow') {

        const col = k === 'arrow' ? '#d9c39a' : '#fff1b0';
        const ax = p.stuckWall ? p.sa : a; if (!p.stuckWall) p.sa = a;
        const c2 = Math.cos(ax), s2 = Math.sin(ax);

        R(cx + c2 * 2 - 1, cy + s2 * 2 - 1, 2, 2, k === 'arrow' ? '#e8e8f0' : '#ffffff');

        R(cx + ca * 3 - 1, cy + sa * 3 - 1, 3, 3, '#dfe6ee');

      } else {

}
function drawEnemyProj(p, x, y, cx, cy) {
  const k = p.kind, t = p.t;
  switch (k) {
    case 'ring': ring(cx, cy, 3 + Math.sin(t * 0.3), '#6ff2ff'); R(cx - 1, cy - 1, 2, 2, '#c8fbff'); break;
    case 'fire': case 'flame': circ(cx, cy, 3, '#ff6a1a'); circ(cx, cy, 2, '#ffb43a'); R(cx - 1, cy - 1, 1, 1, '#fff2b0'); break;
    case 'thorn': R(cx - 1, cy - 3, 2, 6, '#7a5a2a'); R(cx - 3, cy - 1, 6, 2, '#7a5a2a'); R(cx - 1, cy - 1, 2, 2, '#c8e06a'); break;
    case 'shard': R(cx - 2, cy - 2, 4, 4, '#ff7ab8'); R(cx - 1, cy - 1, 1, 1, '#fff'); break;

    case 'ball': circ(cx, cy, 4, '#4a4a55'); R(cx - 2, cy - 3, 2, 1, '#8a8a99'); line(cx, cy, cx - p.vx * 3, cy - p.vy * 3, '#6a6a78'); break;

    }

    case 'crown': {
      const g = '#f2cf5b';
      R(x + 1, y + 4, 12, 5, g); R(x + 1, y, 2, 4, g); R(x + 6, y, 2, 4, g); R(x + 11, y, 2, 4, g);
      R(x + 3, y + 6, 2, 2, '#e8475f'); R(x + 9, y + 6, 2, 2, '#5bbcf0'); R(x + 1, y + 8, 12, 1, '#a8822a'); break;

    case 'coin': circ(cx, cy, 3, '#f2cf5b'); R(cx - 1, cy - 2, 1, 4, '#b38b2c'); R(cx + 1, cy - 2, 1, 1, '#fff2b0'); break;

function updateParts(arr) {
  for (let i = arr.length - 1; i >= 0; i--) {
    const p = arr[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= p.fr; p.vy *= p.fr; p.l--;
    if (p.l <= 0) { arr[i] = arr[arr.length - 1]; arr.pop(); }
  }
}
function drawParts(arr) {
  for (const p of arr) {
    G.globalAlpha = Math.min(1, (p.l / p.m) * p.a * 1.6);
    const y = mod(p.y, WORLD_H);
    G.fillStyle = p.c; G.fillRect(Math.round(p.x), Math.round(y), p.s, p.s);
  }
  G.globalAlpha = 1;
}

class Pickup {
  constructor(kind, x, y, o = {}) {
    this.kind = kind; this.fruit = o.fruit || null; this.w = 10; this.h = 10;
    this.x = Math.round(x - 5); this.y = Math.round(y - 5); this.vx = o.vx || 0; this.vy = o.vy || 0;
    this.rx = 0; this.ry = 0; this.float = !!o.float; this.life = o.life || Infinity; this.t = 0; this.dead = false; this.baseY = this.y;
  }
  update(sc) {
    this.t++;

    if (this.float) { this.y = mod(this.baseY + Math.round(Math.sin(this.t * 0.06) * 2), WORLD_H); }
    else {
      this.vy = Math.min(this.vy + 0.18, 3.2);

      if (moveY(this, this.vy)) { if (this.vy > 0.8) this.vy = -this.vy * 0.4; else this.vy = 0; this.vx *= 0.7; }
    }
    if (this.t < 12) return;
    for (const p of sc.players) {

}

  constructor(sp, style, lines, known) {

    this.hp = 3; this.freed = false; this.ft = 0; this.t = randi(0, 100); this.shakeT = 0; this.dead = false; this.hittable = true; this.known = known;
    this.look = { skin: pick(SKIN), hair: pick(HAIR), cloth: pick(CLOTH) }; this.line = pick(lines); this.light = 26; this.vy = 0;
  }
  update(sc) {

    for (let i = 0; i < 5; i++) sc.part(this.x + 5, this.y + 7, rand(-1.5, 1.5), rand(-2, 0), this.bindColor(), 24, 1, 0.1);

      sc.onCaptive(this);

  }
  bindColor() { return { casulo: '#d8d4e8', gaiola: '#f2cf5b', correntes: '#ff7a3a', bolha: '#9ff0ff', sombra: '#4a4458' }[this.style]; }
  draw(sc) {

    drawPerson(x, y, this.look, { eyesClosed: st === 'casulo' || st === 'sombra' });
    const k = 3 - this.hp;
    if (st === 'casulo') {
      for (let i = 0; i < 5 - k; i++) R(x - 4, y - 13 + i * 3 + (t >> 4) % 2, 9, 2, i % 2 ? '#bfbad2' : '#e2def0');
      if (t % 60 < 30) { R(x + 5, y - 19, 3, 1, '#d8d0ff'); R(x + 7, y - 18, 1, 1, '#d8d0ff'); R(x + 5, y - 17, 3, 1, '#d8d0ff'); }
    } else if (st === 'gaiola') {
      const c = '#e6c35a';
      R(x - 7, y - 20, 15, 2, c); R(x - 7, y, 15, 2, '#b38b2c');
      for (let i = 0; i < 5 - k; i++) R(x - 7 + i * 3.5, y - 18, 1, 18, c);

    } else if (st === 'correntes') {
      for (let i = 0; i < 3 - k; i++) { const yy = y - 12 + i * 4; for (let j = -5; j < 6; j += 2) R(x + j, yy + ((j + i) % 2), 2, 2, (t + j * 3) % 20 < 10 ? '#ff7a3a' : '#c84a1a'); }
    } else if (st === 'bolha') {
      ring(x, y - 8, 10, (t % 40 < 20) ? '#9ff0ff' : '#c9a2ff');
      if (k < 2) ring(x, y - 8, 8, 'rgba(160,240,255,0.5)');
      R(x - 5, y - 15, 2, 2, '#ffffff');
    } else if (st === 'sombra') {
      G.globalAlpha = 0.75 - k * 0.2;
      circ(x, y - 8, 9, '#1a1822'); circ(x - 4, y - 12, 5, '#24202e');
      G.globalAlpha = 1;
      for (let i = 0; i < 3 - k; i++) R(x - 6 + i * 4, y - 6 - i * 3, 12 - i * 2, 2, '#5a5468');
    }
  }
}

// ---- 07_player.js ----
// ============================================================
//  Jogador: movimento fluido (coyote, buffer, dash, wall-jump)
// ============================================================
const PH = {
  grav: 0.34, fall: 4.4, fastFall: 6.4, fastGrav: 0.6, run: 2.3, acc: 0.44, dec: 0.52, airAcc: 0.32, airDec: 0.1, overDec: 0.035,
  jump: -5.6, cut: 0.45, apex: 0.55, coyote: 6, buf: 7, slide: 1.2, wjx: 2.7, wjy: -5.3, wlock: 10,
  dashS: 5.1, dashF: 9, dashCd: 16,
};

class Player {
  constructor(slot, ci, dev, sc) {
    this.slot = slot; this.ci = ci; this.ch = CHARACTERS[ci]; this.dev = dev;
    this.S = SPRITE_SCALE; this.w = Math.round(8 * this.S); this.h = Math.round(12 * this.S); this.x = 0; this.y = 0; this.rx = 0; this.ry = 0; this.vx = 0; this.vy = 0; this.bnd = null;
    this.facing = 1; this.grounded = false; this.coyote = 0; this.jumpBuf = 0; this.jumpCut = false;
    const d = sc.diff;
    this.maxHp = d.hearts + (this.ch.id === 'guardiao' ? 1 : 0) + (Save.hasGift('cura') ? 1 : 0);
    this.hp = this.maxHp;
    this.maxDashes = 1; this.dashes = 1; this.dashT = 0; this.dashCd = 0; this.dashDir = { x: 1, y: 0 }; this.dashHits = new Set();
    this.maxAirJumps = Save.hasGift('fe') ? 1 : 0; this.airJumps = this.maxAirJumps;
    this.wallDir = 0; this.wallLock = 0; this.sliding = false;
    this.iframes = 0; this.state = 'alive'; this.downT = 0; this.reviveP = 0;
    this.slots = [null, null]; this.active = 0; this.shield = false;
    this.louvor = d.louvor; this.maxLouvor = 3;
    this.swordT = 0; this.swordCd = 0; this.swordDir = 'f'; this.swordHits = new Set(); this.swordTile = false;
    this.shootCd = 0; this.shootAnim = 0; this.aimA = 0;
    this.runT = 0; this.landT = 0; this.after = []; this.slowT = 0; this.benT = 0; this.dropT = 0; this.springT = 0; this.fruitFlash = 0; this.t = 0;
  }
  get cx() { return this.x + this.w / 2; } get cy() { return this.y + this.h / 2; }
  fruit() { return this.slots[this.active]; }
  jumpV() { return this.ch.id === 'pastor' ? -6.1 : PH.jump; }

  update(sc) {
    this.t++;
    if (this.state === 'down') { this.updateDown(sc); return; }
    const I = this.dev, held = k => Input.held(I, k), pr = k => Input.pressed(I, k);
    for (const k of ['iframes', 'dashCd', 'swordCd', 'shootCd', 'shootAnim', 'wallLock', 'slowT', 'dropT', 'fruitFlash', 'springT', 'landT']) if (this[k] > 0) this[k]--;
    const mx = (held('r') ? 1 : 0) - (held('l') ? 1 : 0);
    const my = (held('d') ? 1 : 0) - (held('u') ? 1 : 0);

    if (pr('swap')) { this.active = 1 - this.active; Snd.play('swap'); this.fruitFlash = 50; const f = this.fruit(); sc.ftext(f ? FRUITS[f].name : t('noFruit'), this.cx, this.y - 8, f ? FRUITS[f].color : '#aaa'); }
    if (pr('special')) this.useLouvor(sc);

    const was = this.grounded;
    this.grounded = this.dropT > 0 ? solidRect(this.x, this.y + 1, this.w, this.h, null) : onGround(this);
    if (this.grounded) {
      this.coyote = PH.coyote; this.dashes = this.maxDashes; this.airJumps = this.maxAirJumps;
      if (!was && this.vy >= 0) { this.landT = 5; Snd.play('land', 0.1); for (let i = 0; i < 4; i++) sc.part(this.cx + rand(-4, 4), this.y + this.h - 1, rand(-1, 1), rand(-0.6, 0), '#d8d0c0', 16, 1, 0.02); }
    } else if (this.coyote > 0) this.coyote--;

    this.wallDir = 0;
    if (!this.grounded) {
      if (solidRect(this.x - 1, this.y, this.w, this.h, null)) this.wallDir = -1;
      else if (solidRect(this.x + 1, this.y, this.w, this.h, null)) this.wallDir = 1;
    }
    if (pr('jump')) this.jumpBuf = PH.buf; else if (this.jumpBuf > 0) this.jumpBuf--;

    if (this.dashT > 0) this.updateDash(sc);
    else {
      const maxRun = PH.run * (this.slowT > 0 ? 0.55 : 1);
      let acc = this.grounded ? PH.acc : PH.airAcc;
      if (this.wallLock > 0) acc *= 0.2;
      if (mx !== 0) {
        if (Math.abs(this.vx) > maxRun && sign(this.vx) === mx) this.vx = approach(this.vx, mx * maxRun, this.grounded ? PH.dec * 0.4 : PH.overDec);
        else this.vx = approach(this.vx, mx * maxRun, acc);
        if (this.swordT <= 0) this.facing = mx;
      } else this.vx = approach(this.vx, 0, this.grounded ? PH.dec : PH.airDec);

      let g = PH.grav;
      if (!this.grounded) {
        if (held('jump') && Math.abs(this.vy) < 1.1) g *= PH.apex;
        if (my > 0 && this.vy > 0) g = PH.fastGrav;
      }
      this.vy += g;
      let maxF = my > 0 ? PH.fastFall : PH.fall;
      this.sliding = false;
      if (this.wallDir && mx === this.wallDir && this.vy > 0) {
        maxF = PH.slide; this.sliding = true;
        if (this.t % 6 === 0) sc.part(this.wallDir > 0 ? this.x + this.w : this.x, this.y + rand(2, 10), -this.wallDir * 0.4, 0.3, '#d8d0c0', 14, 1, 0);
      }
      if (this.vy > maxF) this.vy = approach(this.vy, maxF, 0.7);
      if (this.jumpCut && !held('jump') && this.vy < 0) { this.vy *= PH.cut; this.jumpCut = false; }
      if (this.vy >= 0) this.jumpCut = false;

      if (this.jumpBuf > 0) {
        if (this.grounded || this.coyote > 0) {
          if (my > 0 && this.grounded && onOnewayOnly(this)) { this.dropT = 12; this.y = mod(this.y + 1, WORLD_H); this.jumpBuf = 0; this.grounded = false; this.coyote = 0; }
          else this.doJump(sc, 'ground');
        } else if (this.wallDir) this.doJump(sc, 'wall');
        else if (this.airJumps > 0) this.doJump(sc, 'air');
      }
      if (pr('dash') && this.dashes > 0 && this.dashCd <= 0) this.startDash(sc, mx, my);
    }

      if (caj) { line(sx - Math.cos(cur) * 4, sy - Math.sin(cur) * 4, tx, ty, '#8b5a2b', 2); R(tx - 1, ty - 1, 3, 3, '#a8743a'); }
      else { line(sx + Math.cos(cur) * 3, sy + Math.sin(cur) * 3, tx, ty, big ? '#fff3c2' : '#e4e8f0'); R(sx + Math.cos(cur) * 3 - 1, sy + Math.sin(cur) * 3 - 1, 3, 3, '#c9933f'); }
      line(sx, sy, sx + Math.cos(cur) * 3, sy + Math.sin(cur) * 3, this.ch.pal.skin);
    } else if (this.shootAnim > 0) {
      const a = this.aimA, ca = Math.cos(a), sa = Math.sin(a);

        const col = k === 'arco' ? '#8b5a2b' : '#d9b26a';
        for (let i = -5; i <= 5; i++) { const t = i / 5, off = (1 - t * t) * 3; R(hx - sa * i + ca * off, hy + ca * i + sa * off, 1, 1, col); }

      }

  }
  drawOrb(sc) {
    const x = this.x + this.w / 2, y = this.y + this.h / 2, t = this.downT;
    const p = 1 + Math.sin(t * 0.12) * 0.15;
    wrapDraw(this.y, this.h, oy => {
      circ(x, y + oy, 9 * p, rgba(this.ch.color, 0.18));

        const n = Math.floor(this.reviveP * 20);
        for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i / 20 * Math.PI * 2; R(x + Math.cos(a) * 11, y + oy + Math.sin(a) * 11, 2, 2, '#fff3c2'); }
      }
    });
  }
}

// ============================================================
//  Inimigos: comportamentos (IA) e desenhos
// ============================================================
class Enemy {
  constructor(type, x, y, sc, o = {}) {
    const t = ETYPES[type];
    this.type = type; this.t = t; this.S = SPRITE_SCALE; this.bw = t.w; this.bh = t.h;
    this.w = Math.round(t.w * this.S); this.h = Math.round(t.h * this.S);
    this.x = Math.round(x - this.w / 2); this.y = Math.round(mod(y - this.h, WORLD_H));
    this.rx = 0; this.ry = 0; this.vx = 0; this.vy = 0; this.kx = 0; this.ky = 0;
    this.facing = chance(0.5) ? 1 : -1;
    this.maxHp = Math.max(1, Math.round(t.hp * sc.diff.ehp)); this.hp = this.maxHp;
    this.state = 'idle'; this.timer = randi(40, 110); this.flash = 0; this.dead = false; this.active = !!o.wave; this.anim = randi(0, 999);
    this.bnd = o.bnd || null; this.home = { x: this.x, y: this.y }; this.grounded = false; this.spawnT = o.spawnT || 0; this.wave = !!o.wave;
    this.light = t.light || 0; this.swell = 0; this.scale = 1; this.alpha = 1; this.open = 0; this.faced = false;
  }
  get cx() { return this.x + this.w / 2; } get cy() { return this.y + this.h / 2; }
  update(sc) {
    this.anim++; if (this.flash > 0) this.flash--; if (this.open > 0) this.open--;
    if (this.spawnT > 0) { this.spawnT--; if (this.spawnT % 3 === 0) sc.part(this.cx + rand(-8, 8), this.cy + rand(-8, 8), 0, -0.4, '#2a1438', 20, 2, 0); return; }
    AI[this.t.ai](this, sc);
    if (this.dead) return;
    if (this.alpha < 0.5) return;
    for (const p of sc.players) {
      if (p.state !== 'alive' || !overlapR(this.x + 1, this.y + 1, this.w - 2, this.h - 2, p.x, p.y, p.w, p.h)) continue;
      const feet = p.y + p.h, top = this.y;
      const fromAbove = p.vy > 0.5 && wrapDY(feet - top) <= 7 && wrapDY(feet - top) >= -2;
      if (fromAbove && !this.t.spiky && p.dashT <= 0) {
        this.hurt(1, p, sc, 'stomp');
        p.vy = Input.held(p.dev, 'jump') ? -6.2 : -4.6; p.jumpCut = Input.held(p.dev, 'jump');
        p.dashes = p.maxDashes; p.airJumps = p.maxAirJumps;
        Snd.play('jump'); sc.part(p.cx, feet, 0, 0, '#ffffff', 8, 3, 0);
      } else if (p.hurt(sc, this.cx)) {
        if (this.type === 'balao') this.die(sc, p);
      }
    }
  }
  physics(sc, grav = true) {
    if (grav) this.vy = Math.min(this.vy + 0.3, 4.5);
    const hx = moveX(this, this.vx + this.kx); this.kx *= 0.8;
    const hy = moveY(this, this.vy + this.ky); this.ky *= 0.8;
    if (hy) { this.vy = 0; this.ky = 0; }
    this.grounded = onGround(this);
    return hx;
  }
  fly(sc) {
    const hx = moveX(this, this.vx + this.kx); this.kx *= 0.85;
    const hy = moveY(this, this.vy + this.ky); this.ky *= 0.85;
    if (hx) this.vx = -this.vx * 0.3; if (hy) this.vy = -this.vy * 0.3;
  }
  groundAhead() {
    const ax = this.facing > 0 ? this.x + this.w + 1 : this.x - 2, ay = this.y + this.h + 2;
    const t = tileAt(Math.floor(ax / TS), Math.floor(ay / TS));
    return isSolidT(t) || t === T_ONEWAY;
  }
  walk(sc, spd) {
    if (this.grounded) {
      this.vx = this.facing * spd * sc.diff.espd;
      if (solidRect(this.x + this.facing * 2, this.y, this.w, this.h, this.bnd) || !this.groundAhead()) { this.facing = -this.facing; this.vx = 0; }
    } else this.vx *= 0.95;
  }
  hurt(d, src, sc, how) {
    if (this.dead) return 'dead';
    if (this.immune && this.immune(how, src)) { Snd.play('tink'); sc.part(this.cx, this.cy, 0, -1, '#ffffff', 10, 2, 0); return 'immune'; }
    if (this.reflects && this.reflects(how, src)) { Snd.play('tink'); return 'reflect'; }
    this.hp -= d; this.flash = 7; Snd.play('hit');
    for (let i = 0; i < 4; i++) sc.part(this.cx, this.cy, rand(-1.5, 1.5), rand(-2, 0.5), '#ffffff', 12, 1, 0.05);
    if (this.hp <= 0) this.die(sc, src);
    return 'hit';
  }
  knock(kx, ky) { if (!this.t.heavy && !this.t.fly) { this.kx = kx; this.ky = ky * 0.4; } else if (this.t.fly) { this.kx = kx * 0.6; this.ky = ky * 0.4; } }
  die(sc, src) {
    if (this.dead) return;
    this.dead = true; Snd.play('kill'); sc.freeze(2);
    for (let i = 0; i < 16; i++) { const a = rand(0, 6.28), s = rand(0.5, 2.2); sc.part(this.cx, this.cy, Math.cos(a) * s, Math.sin(a) * s, pick(['#1a1224', '#2e2040', '#3d2a52']), randi(20, 34), 2, -0.02); }
    for (let i = 0; i < 6; i++) sc.part(this.cx + rand(-4, 4), this.cy + rand(-4, 4), rand(-0.3, 0.3), -rand(0.6, 1.4), '#fff3c2', randi(30, 50), 1, 0);
    if (this.type === 'balao') { for (let i = 0; i < 8; i++) spawnEnemyProj(sc, 'shard', this.cx, this.cy, i / 8 * Math.PI * 2); Snd.play('pop'); }
    sc.onEnemyDie(this);
  }
  draw(sc) {
    if (this.spawnT > 0) {
      const k = 1 - this.spawnT / 40;
      circ(this.cx, this.cy, 4 + k * 8, 'rgba(30,10,40,0.85)'); ring(this.cx, this.cy, 5 + k * 9, '#7a3aa8');
      return;
    }
    const c = col => this.flash > 0 ? '#ffffff' : col;
    const ol = () => '#0b0912';
    const ghost = this.type === 'sombra' || this.type === 'nevoa';
    G.globalAlpha = this.alpha;
    wrapDraw(this.y, this.h, oy => spriteDraw(this.x + this.w / 2, this.y + this.h + oy, (bx, by) => {
      const x = bx - Math.round(this.bw / 2), y = by - this.bh;
      if (!ghost) { G.globalAlpha = 0.85; for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) EDRAW[this.type](this, x + dx, y + dy, ol); G.globalAlpha = 1; }
      EDRAW[this.type](this, x, y, c);
    }));
    G.globalAlpha = 1;
  }
}

function nearestPlayer(sc, e) {
  let best = null, bd = 1e9;
  for (const p of sc.players) if (p.state === 'alive') { const d = edist(p, e); if (d < bd) { bd = d; best = p; } }
  return best;
}

const AI = {
  walker(e, sc) {
    e.walk(sc, e.t.speed);
    if (e.t.slime && e.grounded && e.anim % 36 === 0) sc.objs.push(new Slime(e.x + 2, e.y + e.h - 3));
    e.physics(sc);
  },
  hover(e, sc) {
    const p = nearestPlayer(sc, e);
    if (!p) { e.fly(sc); return; }
    const side = ecx(p) < e.cx ? 1 : -1;
    const tx = ecx(p) + side * 72, ty = ecy(p) - 50 + Math.sin(e.anim * 0.04) * 12;
    const dx = tx - e.cx, dy = wrapDY(ty - e.cy), sp = sc.diff.espd;
    e.vx = approach(e.vx, clamp(dx * 0.02, -1, 1) * sp, 0.05);
    e.vy = approach(e.vy, clamp(dy * 0.02, -1, 1) * sp, 0.05);
    e.facing = ecx(p) > e.cx ? 1 : -1;
    e.fly(sc);
    if (--e.timer <= 0) {
      e.timer = Math.round(e.t.fire / sc.diff.efire) + randi(-25, 25);
      const a = angTo(e, p), n = e.t.burst || 1;
      for (let i = 0; i < n; i++) spawnEnemyProj(sc, e.t.proj, e.cx, e.cy, a + (i - (n - 1) / 2) * 0.28);
      Snd.play('shoot_e'); e.open = 14;
    }
  },
  hopper(e, sc) {
    const was = e.grounded;
    if (e.grounded) {
      e.vx = approach(e.vx, 0, 0.25);
      if (--e.timer <= 0) {
        const p = nearestPlayer(sc, e);
        const dir = p ? (sign(ecx(p) - e.cx) || e.facing) : e.facing;
        e.facing = dir; e.vy = -5.2; e.vx = dir * 1.9 * sc.diff.espd; e.timer = randi(50, 90); e.open = 30;
      }
    }
    if (e.physics(sc)) e.vx = -e.vx * 0.5;
    if (!was && e.grounded) { sc.shake(1, 4); for (let i = 0; i < 5; i++) sc.part(e.cx + rand(-8, 8), e.y + e.h, rand(-1, 1), -0.4, '#c8b8d8', 18, 1, 0); }
  },
  charger(e, sc) {
    const p = nearestPlayer(sc, e);
    if (e.state === 'idle') {
      e.walk(sc, e.t.speed);
      if (p && e.grounded && Math.abs(wrapDY(ecy(p) - e.cy)) < 26 && Math.abs(ecx(p) - e.cx) < 170) {
        e.facing = sign(ecx(p) - e.cx) || e.facing; e.state = 'wind'; e.timer = 32; e.vx = 0;
      }
    } else if (e.state === 'wind') {
      e.vx = 0; if (e.anim % 4 === 0) sc.part(e.cx - e.facing * 6, e.y + e.h, -e.facing, -0.5, '#d8d0c0', 14, 1, 0);
      if (--e.timer <= 0) { e.state = 'charge'; e.timer = 80; }
    } else if (e.state === 'charge') {
      e.vx = e.facing * e.t.chargeSpd * sc.diff.espd;
      if (e.anim % 2 === 0) sc.part(e.cx, e.cy, -e.facing, 0, e.type === 'brasa' ? '#ff7a2a' : '#f2cf5b', 14, 2, 0);
      const ga = e.groundAhead();
      const hit = e.physics(sc);
      if (hit || --e.timer <= 0 || !ga) { e.state = 'stun'; e.timer = 45; e.vx = 0; if (hit) { sc.shake(2, 6); Snd.play('land'); } }
      return;
    } else if (e.state === 'stun') {
      e.vx = 0; if (--e.timer <= 0) { e.state = 'idle'; if (p) e.facing = sign(ecx(p) - e.cx) || e.facing; }
    }
    e.physics(sc);
  },
  floater(e, sc) {
    const p = nearestPlayer(sc, e);
    if (p) {
      const a = angTo(e, p), sp = 0.5 * sc.diff.espd;
      e.vx = approach(e.vx, Math.cos(a) * sp, 0.02); e.vy = approach(e.vy, Math.sin(a) * sp + Math.sin(e.anim * 0.05) * 0.25, 0.02);
    }
    e.swell = Math.min(1, e.swell + 0.0025);
    e.fly(sc);
  },
  pavao(e, sc) {
    const p = nearestPlayer(sc, e);
    if (e.state === 'idle') {
      e.walk(sc, e.t.speed);
      if (--e.timer <= 0 && e.grounded) { e.state = 'fan'; e.timer = 110; e.vx = 0; if (p) e.facing = sign(ecx(p) - e.cx) || e.facing; }
    } else {
      e.vx = 0; e.timer--;
      if ((e.timer === 70 || e.timer === 35) && p) { const a = angTo(e, p); for (let i = -1; i <= 1; i++) spawnEnemyProj(sc, 'shard', e.cx, e.y + 4, a + i * 0.3); Snd.play('shoot_e'); }
      if (e.timer <= 0) { e.state = 'idle'; e.timer = randi(120, 190); }
    }
    e.physics(sc);
  },
  turret(e, sc) {
    e.physics(sc);
    const p = nearestPlayer(sc, e); if (!p) return;
    e.facing = sign(ecx(p) - e.cx) || 1;
    if (Math.abs(ecx(p) - e.cx) > 280) return;
    if (--e.timer <= 0) {
      e.timer = Math.round(e.t.fire / sc.diff.efire) + randi(-20, 20);
      const T = 46, g = 0.15, dx = ecx(p) - e.cx, dy = wrapDY(ecy(p) - (e.y + 2));
      spawnEnemyProj(sc, 'thorn', e.cx, e.y + 2, 0, { vx: clamp(dx / T, -3.6, 3.6), vy: clamp((dy - 0.5 * g * T * T) / T, -6.5, 2) });
      e.open = 16; Snd.play('shoot_e');
    }
  },
  lunger(e, sc) {
    const p = nearestPlayer(sc, e);
    if (e.state === 'idle') {
      e.walk(sc, e.t.speed);
      if (--e.timer < 0 && p && e.grounded && Math.abs(ecx(p) - e.cx) < 100 && Math.abs(wrapDY(ecy(p) - e.cy)) < 44) {
        e.state = 'coil'; e.timer = 22; e.facing = sign(ecx(p) - e.cx) || e.facing; e.vx = 0;
      }
    } else if (e.state === 'coil') {
      e.vx = 0; if (--e.timer <= 0) { e.state = 'leap'; e.vy = -3.8; e.vx = e.facing * 3.3 * sc.diff.espd; e.grounded = false; }
    } else if (e.state === 'leap') {
      if (e.grounded && e.vy >= 0) { e.state = 'idle'; e.timer = 50; }
    }
    e.physics(sc);
  },
  lure(e, sc) {
    const p = nearestPlayer(sc, e);
    if (e.state === 'idle') {
      const ty = e.home.y + Math.sin(e.anim * 0.03) * 6, tx = e.home.x + Math.sin(e.anim * 0.013) * 10;
      e.vx = approach(e.vx, clamp((tx - e.x) * 0.03, -0.6, 0.6), 0.03); e.vy = approach(e.vy, clamp(wrapDY(ty - e.y) * 0.03, -0.6, 0.6), 0.03);
      if (p) e.facing = sign(ecx(p) - e.cx) || e.facing;
      if (e.timer > 0) e.timer--;
      if (p && e.timer <= 0 && edist(e, p) < 100) { e.state = 'reveal'; e.timer = 24; }
      e.light = 46;
    } else if (e.state === 'reveal') {
      e.vx *= 0.8; e.vy *= 0.8; e.light = 22;
      if (--e.timer <= 0) { e.state = 'dive'; e.timer = 44; const a = p ? angTo(e, p) : 0; const s = 3.1 * sc.diff.espd; e.vx = Math.cos(a) * s; e.vy = Math.sin(a) * s; Snd.play('dash'); }
    } else if (e.state === 'dive') {
      if (--e.timer <= 0) e.state = 'return';
    } else {
      const a = Math.atan2(wrapDY(e.home.y - e.y), e.home.x - e.x);
      e.vx = approach(e.vx, Math.cos(a), 0.06); e.vy = approach(e.vy, Math.sin(a), 0.06);
      if (Math.hypot(e.home.x - e.x, wrapDY(e.home.y - e.y)) < 6) { e.state = 'idle'; e.timer = 70; }
    }
    e.fly(sc);
  },
  mask(e, sc) {
    const p = nearestPlayer(sc, e);
    const ty = e.home.y + Math.sin(e.anim * 0.04) * 5;
    e.vy = approach(e.vy, clamp(wrapDY(ty - e.y) * 0.05, -0.5, 0.5), 0.05); e.vx = approach(e.vx, clamp((e.home.x - e.x) * 0.03, -0.5, 0.5), 0.05);
    if (p) e.facing = sign(ecx(p) - e.cx) || e.facing;
    e.fly(sc);
    e.timer--;
    if (e.state === 'idle') { if (e.timer <= 0) { e.state = 'turn'; e.timer = 22; } }
    else if (e.state === 'turn') { if (e.timer <= 0) { e.state = 'angry'; e.timer = 100; } }
    else if (e.state === 'angry') {
      if ((e.timer === 78 || e.timer === 40) && p) { const a = angTo(e, p); for (let i = -1; i <= 1; i++) spawnEnemyProj(sc, 'lie', e.cx, e.cy, a + i * 0.26); Snd.play('shoot_e'); }
      if (e.timer <= 0) { e.state = 'idle'; e.timer = Math.round(randi(90, 140) / sc.diff.efire); }
    }
  },
  thrower(e, sc) {
    const p = nearestPlayer(sc, e);
    if (e.state === 'idle') {
      e.walk(sc, e.t.speed);
      if (--e.timer <= 0 && p && Math.abs(ecx(p) - e.cx) < 250 && e.grounded) { e.state = 'throw'; e.timer = 30; e.facing = sign(ecx(p) - e.cx) || 1; }
    } else {
      e.vx = 0;
      if (--e.timer === 10 && p) {
        const T = 42, g = 0.2, dx = ecx(p) - e.cx, dy = wrapDY(ecy(p) - (e.y + 2));
        spawnEnemyProj(sc, 'ball', e.cx, e.y + 2, 0, { vx: clamp(dx / T, -3.4, 3.4), vy: clamp((dy - 0.5 * g * T * T) / T, -7, 2) });
        Snd.play('funda');
      }
      if (e.timer <= 0) { e.state = 'idle'; e.timer = Math.round(e.t.fire / sc.diff.efire) + randi(-20, 30); }
    }
    e.physics(sc);
  },
  fear(e, sc) {
    const p = nearestPlayer(sc, e); if (!p) return;
    const faced = sign(e.cx - ecx(p)) === p.facing;
    e.faced = faced;
    if (faced) { e.vx *= 0.85; e.vy *= 0.85; e.scale = approach(e.scale, 0.7, 0.02); }
    else {
      const a = angTo(e, p), sp = 1.15 * sc.diff.espd;
      e.vx = approach(e.vx, Math.cos(a) * sp, 0.06); e.vy = approach(e.vy, Math.sin(a) * sp, 0.06);
      e.scale = approach(e.scale, 1.3, 0.01);
    }
    e.x += e.vx + e.kx; e.y = mod(e.y + e.vy + e.ky, WORLD_H); e.kx *= 0.85; e.ky *= 0.85;
    if (e.bnd) e.x = clamp(e.x, e.bnd.min, e.bnd.max - e.w);
  },
  blinker(e, sc) {
    const p = nearestPlayer(sc, e);
    e.timer--;
    if (e.state === 'idle') {
      e.y = mod(e.y + Math.sin(e.anim * 0.06) * 0.3, WORLD_H);
      if (e.timer <= 0) { e.state = 'fade'; e.timer = 20; }
    } else if (e.state === 'fade') {
      e.alpha = e.timer / 20;
      if (e.timer <= 0) {
        if (p) for (let k = 0; k < 12; k++) {
          const a = rand(0, 6.28), d = rand(70, 130);
          const nx = Math.round(ecx(p) + Math.cos(a) * d - e.w / 2), ny = Math.round(mod(ecy(p) + Math.sin(a) * d - e.h / 2, WORLD_H));
          if (nx > sc.cam + 10 && nx < sc.cam + W - 24 && (!e.bnd || (nx > e.bnd.min && nx < e.bnd.max - e.w)) && !solidRect(nx, ny, e.w, e.h, null)) { e.x = nx; e.y = ny; break; }
        }
        e.state = 'appear'; e.timer = 20;
      }
    } else if (e.state === 'appear') {
      e.alpha = 1 - e.timer / 20;
      if (e.timer <= 0) {
        e.state = 'idle'; e.alpha = 1; e.timer = Math.round(150 / sc.diff.efire) + randi(-20, 20);
        if (p) { spawnEnemyProj(sc, 'doubt', e.cx, e.cy, angTo(e, p)); Snd.play('shoot_e'); }
      }
    }
  },
};
// imunidades/reflexos específicos
ETYPES.pavao.reflect = true;
Enemy.prototype.reflects = function (how, src) {
  return this.type === 'pavao' && this.state === 'fan' && how == null && src && src.vx != null && sign(src.vx) === -this.facing;
};

const FLOOR_Y = 19 * TS; // topo do chão das salas de chefe

class Boss {
  constructor(sc, room, baseHp) {
    this.sc = sc; this.room = room; this.rx = room.x0;
    this.maxHp = Math.round(baseHp * sc.diff.boss * (1 + 0.6 * (sc.players.length - 1)));
    this.hp = this.maxHp; this.flash = 0; this.t = 0; this.state = 'intro'; this.timer = 140; this.dead = false; this.dying = 0;
    this.phase2 = false; this.hz = []; this.last = null; this.facing = -1; this.dmgMul = 1; this.light = 60;
  }
  get cx() { return this.x + this.w / 2; } get cy() { return this.y + this.h / 2; }
  hurtBox() { return [this.x, this.y, this.w, this.h]; }
  contactBoxes() { return [[this.x + 4, this.y + 4, this.w - 8, this.h - 6]]; }
  hitTest(r) { if (this.dying || this.dead) return false; const b = this.hurtBox(); return b && overlapR(r.x, r.y, r.w, r.h, b[0], b[1], b[2], b[3]); }
  hurt(d, sc) {
    if (this.dead || this.dying || this.state === 'intro') return;
    if (this.invuln) { Snd.play('tink'); return; }
    this.hp -= d * this.dmgMul; this.flash = 5; Snd.play('bosshit', 0.05);
    if (!this.phase2 && this.hp <= this.maxHp / 2) { this.phase2 = true; this.onPhase2 && this.onPhase2(sc); sc.shake(5, 20); Snd.play('roar'); }
    if (this.hp <= 0) { this.hp = 0; this.dying = 1; sc.onBossDying(this); Snd.play('roar'); }
  }
  pickAttack(list) {
    let opts = list.filter(a => a !== this.last);
    const a = pick(opts.length ? opts : list); this.last = a; return a;
  }
  update(sc) {
    this.t++; if (this.flash > 0) this.flash--;
    if (this.dying) {
      this.dying++;
      if (this.dying % 6 === 0) { const x = this.x + rand(0, this.w), y = this.y + rand(0, this.h); for (let i = 0; i < 6; i++) sc.part(x, y, rand(-2, 2), rand(-2, 2), pick(['#1a1224', '#3d2a52', '#fff3c2']), 30, 2, 0); Snd.play('boom', 0.1); sc.shake(2, 6); }
      if (this.dying > 150) { this.dead = true; sc.onBossDead(this); }
      return;
    }
    if (this.state === 'intro') { this.introUpdate && this.introUpdate(sc); if (--this.timer <= 0) this.next(sc); return; }
    this.ai(sc);
    for (const h of this.hz) h.t++;
    this.hz = this.hz.filter(h => h.t < h.end);
    for (const p of sc.players) {
      if (p.state !== 'alive') continue;
      for (const b of this.contactBoxes()) if (overlapR(p.x, p.y, p.w, p.h, b[0], b[1], b[2], b[3])) { p.hurt(sc, this.cx); break; }
      for (const h of this.hz) if (h.act && h.act(h) && overlapR(p.x, p.y, p.w, p.h, ...h.box(h))) p.hurt(sc, h.box(h)[0] + h.box(h)[2] / 2);
    }
  }
  targetPlayer() { const al = this.sc.players.filter(p => p.state === 'alive'); return al.length ? pick(al) : null; }
  fc(col) { return this.flash > 0 ? '#ffffff' : col; }
  draw(sc) {
    if (this.dying) { G.globalAlpha = Math.max(0, 1 - this.dying / 150); if (this.dying % 8 < 4) this.flash = 1; }
    this.render(sc);
    G.globalAlpha = 1;
    for (const h of this.hz) h.draw && h.draw(h);
  }
}

class BossPreguica extends Boss {
  constructor(sc, room) {
    super(sc, room, 64);
    this.w = 64; this.h = 44; this.x = this.rx + 450; this.y = FLOOR_Y - this.h; this.roll = 0; this.mouth = 0; this.sleep = false;
  }
  next(sc) {
    const list = ['yawn', 'pillows', 'roll'];
    if (this.phase2) list.push('snore', 'yawn');
    this.state = this.pickAttack(list); this.timer = 0;
    if (this.state === 'snore' && sc.enemies.filter(e => !e.dead).length < 2) sc.spawnWaveEnemy('lesma', this.rx + 60 + rand(0, 520), 80);
  }
  ai(sc) {
    this.timer++;
    const sp = this.phase2 ? 1.25 : 1, f = this.facing;
    this.dmgMul = this.state === 'snore' ? 1.6 : 1;
    switch (this.state) {
      case 'idle': this.mouth = 0; if (this.timer > 60 / sp) this.next(sc); break;
      case 'yawn':

const ACCUSATIONS = ['CULPADO', 'INDIGNO', 'FRACASSO', 'HIPÓCRITA', 'SEM PERDÃO', 'INÚTIL', 'ACABOU', 'SUJO', 'NINGUÉM TE QUER'];
class BossAcusador extends Boss {
  constructor(sc, room) {
    super(sc, room, 90);
    this.w = 40; this.h = 76; this.spots = [this.rx + 470, this.rx + 300, this.rx + 130]; this.spot = 0;
    this.x = this.spots[0]; this.y = 140; this.baseY = 140; this.alpha = 1; this.eyes = 0; this.light = 50;
  }
  hurtBox() { return [this.x + 2, this.y + 4, this.w - 4, this.h - 12]; }
  contactBoxes() { return [[this.x + 8, this.y + 14, this.w - 16, this.h - 30]]; }
  onPhase2(sc) { sc.spawnWaveEnemy('sombra', this.rx + 60, 60); sc.spawnWaveEnemy('sombra', this.rx + 580, 60); }
  next(sc) {
    const list = ['words', 'chains', 'sweep', 'words']; if (this.phase2) list.push('teleport', 'shadows', 'chains');
    this.state = this.pickAttack(list); this.timer = 0;
    this.targetY = pick([128, 168, 200]);
  }
  ai(sc) {
    this.timer++;
    const sp = this.phase2 ? 1.3 : 1;
    if (this.targetY) this.baseY = approach(this.baseY, this.targetY, 0.8);
    this.y = this.baseY + Math.sin(this.t * 0.03) * 8;
    this.invuln = this.alpha < 0.5;
    this.eyes = Math.max(0, this.eyes - 0.03);
    switch (this.state) {
      case 'idle': if (this.timer > 55 / sp) this.next(sc); break;
      case 'words': {
        this.eyes = 1;
        const n = this.phase2 ? 4 : 3;
        if (this.timer % 28 === 0 && this.timer <= n * 28) {
          const p = this.targetPlayer();
          if (p) {
            const ox = this.cx, oy = this.y + 20;
            if (this.phase2 && this.timer === 56) { for (let i = 0; i < 6; i++) this.word(sc, ox, oy, i / 6 * Math.PI * 2 + this.t * 0.1, 1.4); }
            else { const a = angTo({ x: ox, y: oy, w: 0, h: 0 }, p); this.word(sc, ox, oy, a, 1.8); }
            Snd.play('shoot_e');
          }
        }
        if (this.timer > n * 28 + 40) { this.state = 'idle'; this.timer = 0; }
        break;
      }
      case 'chains':
        if (this.timer === 1) {
          for (const p of sc.players) if (p.state === 'alive') this.chain(ecx(p));
          if (this.phase2) { this.chain(this.rx + rand(40, 600)); this.chain(this.rx + rand(40, 600)); }
        }
        if (this.timer > 110) { this.state = 'idle'; this.timer = 0; }
        break;
      case 'sweep':
        if (this.timer === 1) {
          const low = chance(0.5), fromLeft = this.cx > this.rx + 320;
          const y = low ? FLOOR_Y - 14 : FLOOR_Y - 42, h = low ? 12 : 22;
          const rx = this.rx;
          this.hz.push({ t: 0, end: 150, y, h, fromLeft, warn: 45,
            act: hh => hh.t > hh.warn,
            box: hh => { const k = clamp((hh.t - hh.warn) / 60, 0, 1); const w = k * (W - 32); return hh.fromLeft ? [rx + 16, hh.y, w, hh.h] : [rx + W - 16 - w, hh.y, w, hh.h]; },
            draw: hh => {
              if (hh.t <= hh.warn) { G.globalAlpha = 0.3 + 0.3 * Math.sin(hh.t * 0.5); R(rx + 16, hh.y, W - 32, hh.h, '#ff3a5a'); G.globalAlpha = 1; return; }
              const b = hh.box(hh); R(b[0], b[1], b[2], b[3], '#d8c8a0');
              for (let i = 0; i < b[2]; i += 10) { R(b[0] + i + 2, b[1] + 3, 6, 1, '#8a1a2a'); if (hh.h > 14) R(b[0] + i + 1, b[1] + 9, 7, 1, '#8a1a2a'); }
              R(b[0], b[1], b[2], 1, '#f4ead0'); R(b[0], b[1] + b[3] - 1, b[2], 1, '#a89870');
            } });
          Snd.play('warn');
        }
        if (this.timer > 150) { this.state = 'idle'; this.timer = 0; }
        break;
      case 'teleport':
        if (this.timer < 25) this.alpha = 1 - this.timer / 25;
        else if (this.timer === 25) { this.spot = (this.spot + 1 + randi(0, 1)) % 3; this.x = this.spots[this.spot]; }
        else if (this.timer < 50) this.alpha = (this.timer - 25) / 25;
        else { this.alpha = 1; this.state = 'words'; this.timer = 0; }
        break;
      case 'shadows':
        if (this.timer === 20 && sc.enemies.filter(e => !e.dead).length < 3) { sc.spawnWaveEnemy('sombra', this.rx + 60, 60); sc.spawnWaveEnemy('sombra', this.rx + 580, 60); }
        if (this.timer > 60) { this.state = 'idle'; this.timer = 0; }
        break;
    }
  }
  word(sc, x, y, a, spd) {
    const text = pick(ACCUSATIONS);
    const w = Math.max(24, text.length * 5 + 4);
    const p = spawnEnemyProj(sc, 'word', x, y, a, { speed: spd });
    p.text = text; p.w = w; p.x = x - w / 2;
  }
  chain(x) {
    const cxx = clamp(x, this.rx + 24, this.rx + W - 24);
    this.hz.push({ t: 0, end: 100, x: cxx, warn: 50,
      act: hh => hh.t > hh.warn && hh.t < hh.warn + 34,
      box: hh => [hh.x - 6, 0, 12, WORLD_H],
      draw: hh => {
        if (hh.t <= hh.warn) { G.globalAlpha = 0.25 + 0.25 * Math.sin(hh.t * 0.6); R(hh.x - 6, FLOOR_Y - 4, 12, 4, '#ff3a5a'); R(hh.x - 1, 0, 2, FLOOR_Y, '#ff3a5a'); G.globalAlpha = 1; return; }
        if (hh.t > hh.warn + 34) return;
        const k = clamp((hh.t - hh.warn) / 8, 0, 1), top = FLOOR_Y - k * FLOOR_Y;
        for (let y = FLOOR_Y; y > top; y -= 6) { R(hh.x - 3, y - 5, 6, 4, '#6a6a78'); R(hh.x - 1, y - 6, 2, 6, '#9a9aa8'); }
      } });
    Snd.play('warn');
  }
  render() {
    const c = col => this.fc(col), x = Math.round(this.x), y = Math.round(this.y), w = this.w, h = this.h;
    G.globalAlpha *= this.alpha;
    circ(x + w / 2, y + h / 2, 30, 'rgba(10,0,20,0.12)');
    // manto
    R(x + 4, y + 18, w - 8, h - 30, c('#1a1622'));
    for (let i = 0; i < 5; i++) { const off = Math.round(Math.sin(this.t * 0.1 + i) * 2); R(x + 4 + i * 7, y + h - 14 + off, 6, 14 - off, c('#1a1622')); }
    R(x + 2, y + 22, 4, 30, c('#24202e')); R(x + w - 6, y + 22, 4, 30, c('#24202e'));
    // capuz
    for (let i = 0; i < 30; i++) { const hw = Math.min(30, Math.round(3 + i * 1.15)); R(x + w / 2 - hw / 2 + Math.round(Math.sin(this.t * 0.05) * (30 - i) / 30), y - 8 + i, hw, 1, c(i < 2 ? '#2e2838' : '#221e2c')); }
    ellipse(x + w / 2, y + 17, 8, 9, c('#050308'));
    const eyeC = this.eyes > 0.5 ? '#ff3a4a' : '#d8e0ff';
    R(x + w / 2 - 5, y + 15, 3, 2, c(eyeC)); R(x + w / 2 + 2, y + 15, 3, 2, c(eyeC));
    // mão e pergaminho
    const sx = x - 14, sy = y + 30;
    R(sx + 10, sy, 8, 3, c('#c8c0b0'));
    R(sx, sy - 4, 12, 4, c('#a8784a'));
    R(sx + 1, sy, 10, 40, c('#d8c8a0'));
    for (let i = 0; i < 8; i++) R(sx + 2 + (i % 2), sy + 3 + i * 4, 6 + (i * 3) % 3, 1, c('#8a1a2a'));
    R(sx, sy + 40, 12, 4, c('#a8784a'));
    // correntes penduradas
    for (let i = 0; i < 5; i++) R(x + w - 4, y + 40 + i * 4, 2, 3, c('#7a7a88'));
  }
}

// ============================================================
//  Renderização: cenários em paralaxe, luz/escuridão, névoa, HUD
// ============================================================
const BGCACHE = {};
const BG_LW = 1280; // largura das camadas (repetem sem emenda)
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ---------- ajudantes de desenho das camadas ----------
// repete o desenho nas bordas para a camada emendar sem costura
function seam(fn) { fn(0); fn(BG_LW); fn(-BG_LW); }
function ridge(ctx, col, base, waves, rnd, jag = 0) {
  ctx.fillStyle = col;
  const ph = waves.map(() => rnd() * Math.PI * 2);
  for (let x = 0; x < BG_LW; x++) {
    let y = base;
    waves.forEach(([amp, n], i) => { y += Math.sin(x / BG_LW * Math.PI * 2 * n + ph[i]) * amp; });
    if (jag) y += (hash2(x >> 1, base) - 0.5) * jag;
    ctx.fillRect(x, Math.round(y), 1, H - Math.round(y));
  }
}
function roundTree(ctx, x, y, h, r, col, light) {
  ctx.fillStyle = col;
  ctx.fillRect(Math.round(x - 1.5), Math.round(y - h), 3, h);
  ctx.beginPath(); ctx.arc(x, y - h - r * 0.6, r, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x - r * 0.7, y - h - r * 0.1, r * 0.7, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + r * 0.7, y - h - r * 0.2, r * 0.75, 0, 7); ctx.fill();
  if (light) { ctx.fillStyle = light; ctx.beginPath(); ctx.arc(x - r * 0.3, y - h - r * 1.05, r * 0.45, Math.PI, 0); ctx.fill(); }
}
function poplar(ctx, x, y, h, w, col) {
  ctx.fillStyle = col;
  ctx.fillRect(Math.round(x - 1), Math.round(y - h * 0.25), 2, Math.round(h * 0.25));
  ctx.beginPath(); ctx.ellipse(x, y - h * 0.6, w, h * 0.45, 0, 0, 7); ctx.fill();
}
function house(ctx, x, y, w, h, col, win) {
  ctx.fillStyle = col;
  ctx.fillRect(x, y - h, w, h);
  ctx.beginPath(); ctx.moveTo(x - 2, y - h); ctx.lineTo(x + w / 2, y - h - w * 0.55); ctx.lineTo(x + w + 2, y - h); ctx.fill();
  ctx.fillRect(x + w - 5, y - h - w * 0.5, 3, w * 0.35);
  if (win) { ctx.fillStyle = win; ctx.fillRect(x + 3, y - h + 3, 2, 3); if (w > 12) ctx.fillRect(x + w - 6, y - h + 3, 2, 3); }
}
function deadTree(ctx, rnd, x, y, len, a, d, col) {
  if (d <= 0) return;
  const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
  ctx.strokeStyle = col; ctx.lineWidth = d; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2, y2); ctx.stroke();
  deadTree(ctx, rnd, x2, y2, len * 0.7, a - 0.45 - rnd() * 0.3, d - 1, col);
  deadTree(ctx, rnd, x2, y2, len * 0.7, a + 0.35 + rnd() * 0.3, d - 1, col);
}
function dots(ctx, rnd, n, col, y0, y1, size = 1) {
  ctx.fillStyle = col;
  for (let i = 0; i < n; i++) ctx.fillRect(Math.floor(rnd() * BG_LW), Math.floor(y0 + rnd() * (y1 - y0)), size, size);
}

function buildBackground(th) {
  if (BGCACHE[th.bg]) return BGCACHE[th.bg];
  const rnd = mulberry32(th.bg.length * 991 + 7);
  const sky = mkCanvas(W, H), sx = sky.getContext('2d');
  const gr = sx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, th.sky[0]); gr.addColorStop(0.55, th.sky[1]); gr.addColorStop(1, th.sky[2]);
  sx.fillStyle = gr; sx.fillRect(0, 0, W, H);
  // tons das camadas: quanto mais longe, mais perto da cor do céu (perspectiva atmosférica)
  const C = [mixHex(th.sky[1], th.far, 0.3), mixHex(th.sky[1], th.far, 0.62), th.far, th.mid, th.near];
  const hi = k => mixHex(C[k], th.sky[2], 0.18); // realce discreto
  const warm = a => `rgba(255,214,150,${a})`;
  if (th.bg === 'hills' || th.bg === 'towers' || th.bg === 'shadow') {
    for (let i = 0; i < 110; i++) { sx.fillStyle = `rgba(255,250,235,${(0.15 + rnd() * 0.5) * (th.bg === 'shadow' ? 0.5 : 1)})`; sx.fillRect(Math.floor(rnd() * W), Math.floor(rnd() * H * 0.55), 1, 1); }
  }
  if (th.bg === 'hills') {
    sx.fillStyle = 'rgba(240,232,255,0.1)'; sx.beginPath(); sx.arc(480, 70, 32, 0, 7); sx.fill();
    sx.fillStyle = '#e4dcf0'; sx.beginPath(); sx.arc(480, 70, 18, 0, 7); sx.fill();
    sx.fillStyle = '#cfc6e0'; sx.beginPath(); sx.arc(486, 76, 5, 0, 7); sx.fill(); sx.beginPath(); sx.arc(474, 64, 3, 0, 7); sx.fill();
    sx.fillStyle = '#bdb3d2'; sx.fillRect(472, 68, 5, 1); sx.fillRect(484, 68, 5, 1); sx.fillRect(477, 77, 6, 1);
  }
  if (th.bg === 'cave') {
    const g2 = sx.createLinearGradient(0, H * 0.55, 0, H); g2.addColorStop(0, 'rgba(255,90,30,0)'); g2.addColorStop(1, 'rgba(255,90,30,0.28)');
    sx.fillStyle = g2; sx.fillRect(0, H * 0.55, W, H * 0.45);
  }
  if (th.bg === 'towers') {
    const g2 = sx.createRadialGradient(W * 0.5, H * 0.95, 10, W * 0.5, H * 0.95, 360); g2.addColorStop(0, 'rgba(255,200,120,0.18)'); g2.addColorStop(1, 'rgba(255,200,120,0)');
    sx.fillStyle = g2; sx.fillRect(0, 0, W, H);
  }
